          '<p class="kn-section-title">Source (Chinese / 主稿)</p>' +
          '<label class="legacy" style="font-size:0.8rem">Question</label>' +
          '<p style="font-size:0.875rem;color:var(--text);margin:0.25rem 0 0.75rem;line-height:1.5">' + esc(source.title) + '</p>' +
          '<label class="legacy" style="font-size:0.8rem">Answer</label>' +
          '<p style="font-size:0.875rem;color:var(--text);margin:0.25rem 0;white-space:pre-wrap;line-height:1.5">' + esc(source.content) + '</p>' +
          '</div>' +
          // Right: translation tabs
          '<div>' +
          '<p class="kn-section-title">Translation</p>' +
          '<div class="lang-tabs">' + tabsHtml + '</div>' +
          '<div style="font-size:0.78rem;margin-bottom:0.75rem">' + statusLabel2 + '</div>' +
          '<label class="legacy" style="font-size:0.8rem">Translated Question</label>' +
          '<textarea class="legacy" id="trQuestion" rows="2" style="width:100%;resize:vertical;margin-bottom:0.75rem">' + esc(trRow.question || '') + '</textarea>' +
          '<label class="legacy" style="font-size:0.8rem">Translated Answer</label>' +
          '<textarea class="legacy" id="trAnswer" rows="6" style="width:100%;resize:vertical">' + esc(trRow.answer || '') + '</textarea>' +
          '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.85rem">' +
          '<button type="button" class="btn btn-primary" id="knTrPublish">' + (tp.saving ? 'Saving…' : 'Save & Publish') + '</button>' +
          '<button type="button" class="btn" id="knTrDraft">Save as Draft</button>' +
          '<button type="button" class="btn" id="knTrGenerate" style="margin-left:auto">' + (tp.generating ? 'Generating…' : '⚡ Generate Draft') + '</button>' +
          '</div>' +
          (tp.statusMsg ? '<p style="font-size:0.8rem;margin:0.5rem 0 0;color:' + (tp.statusOk ? '#16a34a' : 'var(--danger)') + '">' + esc(tp.statusMsg) + '</p>' : '') +
          '</div>' +
          '</div>' +
          '</div></div>';
      }

      function trStatusPills(entry) {
        // Show translation status for each non-source language
        return TR_LANGS.map(function(l) {
          var cached = trCache[entry.id] && trCache[entry.id][l.code];
          var cls = cached ? (cached.translation_status === 'published' ? 'pub' : 'draft') : '';
          return '<span class="tr-pill' + (cls ? ' ' + cls : '') + '" title="' + l.label + '">' + l.label + '</span>';
        }).join('');
      }

      function mount() {
        var list = filtered();
        var rowsHtml = '';
        if (!state.entries.length) {
          rowsHtml = '<div class="kn-empty wb-empty"><strong>No FAQ entries yet.</strong><br/>Click "+ New FAQ" to create the first one.<br/><a class="btn" href="/app/settings/products" data-spa="/app/settings/products" style="margin-top:0.75rem">Manage Products first</a></div>';
        } else if (!list.length) {
          rowsHtml = '<div class="kn-empty wb-empty"><strong>No results.</strong> Try changing the filters.</div>';
        } else {
          rowsHtml = list.map(function(e) {
            var isOn = e.status === 'published';
            var trPills = trStatusPills(e);
            return '<div class="kn-faq-row">' +
              '<div class="kn-faq-row-info">' +
              '<p class="kn-faq-row-q">' + esc(e.title) + '</p>' +
              '<div class="kn-faq-row-tags">' +
              (e.category ? '<span class="kn-chip wb-chip">' + esc(productName(e.category)) + '</span>' : '') +
              '<span class="kn-chip wb-chip">' + esc(e.language.toUpperCase()) + '</span>' +
              trPills +
              '</div></div>' +
              '<div class="kn-faq-row-actions">' +
              '<button type="button" class="kn-toggle' + (isOn ? ' on' : '') + '" title="' + (isOn ? 'Disable' : 'Enable') + '" data-kn-toggle="' + esc(e.id) + '" data-kn-active="' + (isOn ? '1' : '0') + '"></button>' +
              '<button type="button" class="btn btn-sm kn-tr-btn" data-kn-translate="' + esc(e.id) + '">🌐 Translate</button>' +
              '<button type="button" class="icon-btn" title="Edit" data-kn-edit="' + esc(e.id) + '">\u270e</button>' +
              '<button type="button" class="icon-btn" title="Delete" data-kn-del="' + esc(e.id) + '">\u2715</button>' +
              '</div></div>';
          }).join('');
        }

        var prodFilterOpts = '<option value="all">All products</option>' +
          state.products.map(function(p) {
            return '<option value="' + esc(p.name) + '"' + (state.filters.product === p.name ? ' selected' : '') + '>' + esc(p.name) + '</option>';
          }).join('');
        var langFilterOpts =
          '<option value="all"' + (state.filters.language === 'all' ? ' selected' : '') + '>All languages</option>' +
          ['en','zh','vi','ms-MY'].map(function(l) {
            return '<option value="' + l + '"' + (state.filters.language === l ? ' selected' : '') + '>' + l.toUpperCase() + '</option>';
          }).join('');

        document.getElementById('view').innerHTML = wrapPage(
          'Knowledge',
          'FAQ knowledge base.',
          (state.apiNote ? '<div class="wb-banner">' + esc(state.apiNote) + '</div>' : '') +
          (state.importCta ? (function() {
            var firstId = state.entries.length ? state.entries[0].id : null;
            return '<div class="kn-import-cta">' +
              '<div>' +
              '<div class="kn-import-cta-msg">✓ ' + state.importCta.count + ' FAQ entries imported' + (state.importCta.fail ? ', ' + state.importCta.fail + ' failed' : '') + '.</div>' +
              '<div class="kn-import-cta-hint">Now add translations so users in other languages can get answers.</div>' +
              '</div>' +
              (firstId ? '<button type="button" class="btn btn-primary" style="font-size:0.82rem;white-space:nowrap" data-kn-translate="' + esc(firstId) + '">🌐 Open Translations →</button>' : '') +
              '</div>';
          })() : '') +
          '<div class="kn-page">' +
          '<div class="kn-toolbar wb-toolbar" style="margin-bottom:0.75rem">' +
          '<div class="fld"><label>Product</label><select class="legacy" id="knProdFilter">' + prodFilterOpts + '</select></div>' +
          '<div class="fld"><label>Language</label><select class="legacy" id="knLangFilter">' + langFilterOpts + '</select></div>' +
          '<div class="wb-toolbar-actions"><button type="button" class="btn btn-primary" id="knNewBtn">+ New FAQ</button>' +
          '<button type="button" class="btn" id="knImportBtn">Bulk Import</button>' +
          '<a class="btn" href="/app/settings/products" data-spa="/app/settings/products">Manage products</a></div>' +
          '</div>' +
          '<div style="border:1px solid var(--border);border-radius:var(--radius,6px);min-height:300px;">' +
          '<div style="padding:0.5rem 0.85rem;border-bottom:1px solid var(--border);font-size:0.8rem;color:var(--muted)">FAQ entries \xb7 ' + list.length + ' shown</div>' +
          rowsHtml +
          '</div></div>' +
          renderPanel() +
          renderTranslationPanel() +
          (state.importPanel ? (function() {
            var prodOpts = '<option value="">— No product —</option>' +
              state.products.map(function(p) { return '<option value="' + esc(p.name) + '">' + esc(p.name) + '</option>'; }).join('');
            var langOpts = ['en','zh','vi','ms-MY'].map(function(l) {
              return '<option value="' + l + '">' + l.toUpperCase() + '</option>';
            }).join('');
            return '<div class="kn-panel-overlay" id="knImportOverlay">' +
              '<div class="kn-panel" style="width:500px">' +
              '<div class="kn-panel-head"><h3>Bulk Import FAQ</h3><button type="button" class="icon-btn" id="knImportClose">\u2715</button></div>' +
              '<div class="kn-panel-body">' +
              '<div><label class="legacy">Product</label><select class="legacy" id="impProduct" style="width:100%">' + prodOpts + '</select></div>' +
              '<div><label class="legacy">Language</label><select class="legacy" id="impLanguage" style="width:100%">' + langOpts + '</select></div>' +
              '<div><label class="legacy">Paste FAQ below (Q: / A: format)</label>' +
              '<textarea class="legacy" id="impText" rows="14" style="width:100%;resize:vertical;font-family:monospace;font-size:0.82rem" placeholder="Q: What is M33 Lotto Bot?\nA: M33 Lotto Bot is an automation system for lottery operations.\n\nQ: What platforms are supported?\nA: Telegram. Web and mobile coming soon."></textarea></div>' +
              '<p class="muted" style="margin:0;font-size:0.78rem">Each entry starts with <code>Q:</code> and <code>A:</code>. Separate entries with a blank line.</p>' +
              '</div>' +
              '<div class="kn-panel-actions">' +
              '<button type="button" class="btn btn-primary" id="knImportSave">Import</button>' +
              '<button type="button" class="btn" id="knImportCancel">Cancel</button>' +
              '<span id="impStatus" style="font-size:0.82rem;margin-left:0.5rem"></span>' +
              '</div></div></div>';
          })() : '')
        );
        bindSpaLinks(document.getElementById('view'));

        var pf = document.getElementById('knProdFilter');
        if (pf) pf.onchange = function(ev) { state.filters.product = ev.target.value; mount(); };
        var lf = document.getElementById('knLangFilter');
        if (lf) lf.onchange = function(ev) { state.filters.language = ev.target.value; mount(); };

        var nb = document.getElementById('knNewBtn');
        if (nb) nb.onclick = function() { state.panel = { mode: 'create', entry: { language: 'en' } }; state.importPanel = false; mount(); };

        var ib = document.getElementById('knImportBtn');
        if (ib) ib.onclick = function() { state.importPanel = true; state.panel = null; mount(); };

        // Import panel bindings
        var importOverlay = document.getElementById('knImportOverlay');
        var importClose = document.getElementById('knImportClose');
        var importCancel = document.getElementById('knImportCancel');
        var closeImport = function() { state.importPanel = false; mount(); };
        if (importOverlay) importOverlay.onclick = function(ev) { if (ev.target === importOverlay) closeImport(); };
        if (importClose) importClose.onclick = closeImport;
        if (importCancel) importCancel.onclick = closeImport;

        var importSave = document.getElementById('knImportSave');
        if (importSave) importSave.onclick = async function() {
          var text = (document.getElementById('impText').value || '').trim();
          var product = document.getElementById('impProduct').value || '';
          var language = document.getElementById('impLanguage').value || 'en';
          var status = document.getElementById('impStatus');

          if (!text) { status.textContent = 'Please paste some content.'; status.style.color = 'var(--danger)'; return; }

          // Parse Q: / A: blocks
          var entries = [];
          var blocks = text.split(/\n\s*\n/);
          blocks.forEach(function(block) {
            var qMatch = block.match(/^Q:\s*(.+)/im);
            var aMatch = block.match(/^A:\s*([\s\S]+)/im);
            if (qMatch && aMatch) {
              entries.push({ question: qMatch[1].trim(), answer: aMatch[1].trim() });
            }
          });

          if (!entries.length) { status.textContent = 'No valid Q:/A: pairs found. Check the format.'; status.style.color = 'var(--danger)'; return; }

          status.textContent = 'Importing ' + entries.length + ' entries...';
          status.style.color = 'var(--muted)';
          importSave.disabled = true;

          var ok = 0; var fail = 0;
          for (var i = 0; i < entries.length; i++) {
            try {
              await api(base() + '/knowledge', { method: 'POST', body: JSON.stringify({
                language: language, category: product || 'general',
                question: entries[i].question, answer: entries[i].answer,
                source_type: 'manual', is_active: true
              })});
              ok++;
            } catch (_) { fail++; }
          }

          // Refresh list
          try {
            var k2 = await api(base() + '/knowledge');
            state.entries = Array.isArray(k2.entries) ? k2.entries.map(function(e, i) { return normalizeKnowledgeEntry(e, i); }) : state.entries;
          } catch (_) {}

          state.importPanel = false;
          state.saving = false;
          state.importCta = { count: ok, fail: fail };
          state.apiNote = '';
          mount();
        };

        document.querySelectorAll('[data-kn-toggle]').forEach(function(btn) {
          btn.onclick = async function() {
            var id = btn.getAttribute('data-kn-toggle');
            var isActive = btn.getAttribute('data-kn-active') === '1';
            try {
              await api(base() + '/knowledge/' + encodeURIComponent(id) + (isActive ? '/disable' : '/enable'), { method: 'POST', body: '{}' });
              state.entries = state.entries.map(function(e) {
                return e.id === id ? Object.assign({}, e, { status: isActive ? 'draft' : 'published' }) : e;
              });
              mount();
            } catch (e) { alert('Toggle failed: ' + e.message); }
          };
        });

        document.querySelectorAll('[data-kn-edit]').forEach(function(btn) {
          btn.onclick = function() {
            var id = btn.getAttribute('data-kn-edit');
            var entry = state.entries.find(function(e) { return e.id === id; });
            if (entry) { state.panel = { mode: 'edit', entry: entry }; mount(); }
          };
        });

        document.querySelectorAll('[data-kn-del]').forEach(function(btn) {
          btn.onclick = async function() {
            var id = btn.getAttribute('data-kn-del');
            var entry = state.entries.find(function(e) { return e.id === id; });
            if (!confirm('Delete "' + (entry ? entry.title : id) + '"?')) return;
            try {
              await api(base() + '/knowledge/' + encodeURIComponent(id) + '/disable', { method: 'POST', body: '{}' });
              state.entries = state.entries.filter(function(e) { return e.id !== id; });
              mount();
            } catch (e) { alert('Delete failed: ' + e.message); }
          };
        });

        // Translation workbench
        document.querySelectorAll('[data-kn-translate]').forEach(function(btn) {
          btn.onclick = async function() {
            var id = btn.getAttribute('data-kn-translate');
            state.panel = null; state.importPanel = false;
            state.trPanel = { sourceId: id, activeLang: 'en', data: trCache[id] || {}, saving: false, generating: false };
            mount();
            // Load translations async
            try {
              var r = await api(base() + '/knowledge/' + encodeURIComponent(id) + '/translations');
              var data = {};
              (r.translations || []).forEach(function(t) { data[t.language] = t; });
              trCache[id] = data;
              state.trPanel.data = data;
              mount();
            } catch (_) {}
          };
        });

        var knTrOverlay = document.getElementById('knTrPanelOverlay');
        var knTrClose = document.getElementById('knTrClose');
        function closeTrPanel() { state.trPanel = null; mount(); }
        if (knTrOverlay) knTrOverlay.onclick = function(ev) { if (ev.target === knTrOverlay) closeTrPanel(); };
        if (knTrClose) knTrClose.onclick = closeTrPanel;

        // Translation language tabs
        document.querySelectorAll('[data-tr-tab]').forEach(function(tab) {
          tab.onclick = function() {
            if (state.trPanel) {
              state.trPanel.activeLang = tab.getAttribute('data-tr-tab');
              mount();
            }
          };
        });

        async function saveTr(status) {
          if (!state.trPanel) return;
          var q = (document.getElementById('trQuestion').value || '').trim();
          var a = (document.getElementById('trAnswer').value || '').trim();
          if (!q || !a) { alert('Translated question and answer are required.'); return; }
          state.trPanel.saving = true; mount();
          try {
            var sid = state.trPanel.sourceId;
            var lang = state.trPanel.activeLang;
            var r = await api(base() + '/knowledge/' + encodeURIComponent(sid) + '/translations/' + encodeURIComponent(lang), {
              method: 'PUT',
              body: JSON.stringify({ question: q, answer: a, status: status }),
            });
            if (!trCache[sid]) trCache[sid] = {};
            trCache[sid][lang] = r.translation;
            state.trPanel.data = trCache[sid];
            state.trPanel.statusMsg = status === 'published' ? '✓ Published successfully' : '· Saved as draft';
            state.trPanel.statusOk = true;
          } catch (e) {
            state.trPanel.statusMsg = 'Save failed: ' + e.message;
            state.trPanel.statusOk = false;
          }
          state.trPanel.saving = false; mount();
        }

        var knTrPublish = document.getElementById('knTrPublish');
        var knTrDraft = document.getElementById('knTrDraft');
        var knTrGen = document.getElementById('knTrGenerate');
        if (knTrPublish) knTrPublish.onclick = function() { saveTr('published'); };
        if (knTrDraft) knTrDraft.onclick = function() { saveTr('draft'); };
        if (knTrGen) knTrGen.onclick = async function() {
          if (!state.trPanel) return;
          state.trPanel.generating = true; mount();
          try {
            var sid2 = state.trPanel.sourceId;
            var lang2 = state.trPanel.activeLang;
            var r2 = await api(base() + '/knowledge/' + encodeURIComponent(sid2) + '/generate-translation', {
              method: 'POST',
              body: JSON.stringify({ lang: lang2 }),
            });
            if (!trCache[sid2]) trCache[sid2] = {};
            trCache[sid2][lang2] = r2.translation;
            state.trPanel.data = trCache[sid2];
            state.trPanel.statusMsg = 'Draft generated — please review before publishing.';
            state.trPanel.statusOk = true;
          } catch (e) {
            var errMsg = (e && e.message) ? e.message : String(e);
            state.trPanel.statusMsg = '⚠ Generate failed: ' + errMsg;
            state.trPanel.statusOk = false;
          }
          state.trPanel.generating = false; mount();
        };

        var overlay = document.getElementById('knPanelOverlay');
        var closeBtn = document.getElementById('knPanelClose');
        var cancelBtn = document.getElementById('knPanelCancel');
        function closeFn() { state.panel = null; mount(); }
        if (overlay) overlay.onclick = function(ev) { if (ev.target === overlay) closeFn(); };
        if (closeBtn) closeBtn.onclick = closeFn;
        if (cancelBtn) cancelBtn.onclick = closeFn;

        var saveBtn = document.getElementById('knPanelSave');
        if (saveBtn) {
          saveBtn.onclick = async function() {
            var question = (document.getElementById('kpQuestion').value || '').trim();
            var answer = (document.getElementById('kpAnswer').value || '').trim();
            var product = document.getElementById('kpProduct').value || '';
            var language = document.getElementById('kpLanguage').value || 'en';
            if (!question || !answer) { alert('Question and answer are required.'); return; }
            state.saving = true;
            mount();
            try {
              var payload = JSON.stringify({ language: language, category: product || 'general', question: question, answer: answer, source_type: 'manual', is_active: false });
              if (state.panel && state.panel.mode === 'create') {
                await api(base() + '/knowledge', { method: 'POST', body: payload });
                var k2 = await api(base() + '/knowledge');
                state.entries = Array.isArray(k2.entries) ? k2.entries.map(function(e, i) { return normalizeKnowledgeEntry(e, i); }) : state.entries;
              } else if (state.panel) {
                var eid = state.panel.entry.id;
                await api(base() + '/knowledge/' + encodeURIComponent(eid), { method: 'PUT', body: payload });
                var k3 = await api(base() + '/knowledge');
                state.entries = Array.isArray(k3.entries) ? k3.entries.map(function(e, i) { return normalizeKnowledgeEntry(e, i); }) : state.entries;
              }
              state.panel = null;
            } catch (e) {
              alert('Save failed: ' + e.message);
            }
            state.saving = false;
            mount();
          };
        }
      }
      mount();
    }

    async function viewTeam() {
      const pr = await api(base() + '/principals');
      document.getElementById('view').innerHTML = wrapPage('Team', '过渡期 · 将迁入 Settings → Roles',
        '<pre class="raw">' + esc(JSON.stringify(pr.principals || [], null, 2)) + '</pre>');
    }

    async function viewInbox() {
      document.getElementById('view').innerHTML = wrapPage(
        'Inbox',
        '统一工作台加载中…',
        '<div class="inbox-page"><div class="wb-banner">Loading inbox workspace...</div><div class="inbox-board"><div class="inbox-col-list"><div class="inbox-list-head">Conversations</div><div class="inbox-list-scroll"><div class="wb-loading"><div class="wb-skeleton"></div><div class="wb-skeleton"></div><div class="wb-skeleton"></div></div><div class="wb-loading"><div class="wb-skeleton"></div><div class="wb-skeleton"></div><div class="wb-skeleton"></div></div></div></div><div class="inbox-col-mid"><div class="wb-empty"><strong>Loading...</strong>正在加载会话。</div></div><div class="inbox-col-side"><div class="wb-empty"><strong>Loading...</strong>正在加载上下文。</div></div></div></div>'
      );
      let raw = [];
      let apiNote = false;
      let apiError = '';
      const useMockPreview = queryParam('dev_mock_inbox', '0') === '1';
      try {
        const r = await api(base() + '/conversations?limit=50&offset=0');
        raw = r.conversations || [];
      } catch (e) {
        apiNote = true;
        apiError = (e && e.message ? String(e.message) : 'unknown_error').slice(0, 240);
        raw = useMockPreview ? MOCK_INBOX_CONVERSATIONS.slice() : [];
      }
      const list = raw.map(normalizeInboxConversation);
      const qStatus = queryParam('status', 'all');
      const qOwner = queryParam('owner', 'all');
      const qSource = queryParam('src', '');
      const allowedInboxStatus = ['all', 'new', 'open', 'pending_handoff', 'human_handling', 'closed'];
      const state = {
        list,
        selectedId: list.length ? list[0].id : null,
        filters: {
          q: '',
          status: allowedInboxStatus.includes(qStatus) ? qStatus : 'all',
          channel: 'all',
          owner: qOwner === 'assigned' || qOwner === 'unassigned' ? qOwner : 'all',
          time: 'all',
        },
        apiNote,
        apiError,
        useMockPreview: apiNote && useMockPreview,
        source: qSource,
        // Message cache: { [conversationId]: MessageRow[] }
        messagesCache: {},
        messagesLoading: false,
      };

      async function loadMessages(convId) {
        if (!convId || state.messagesCache[convId]) return;
        state.messagesLoading = true;
        try {
          const r = await api(base() + '/conversations/' + encodeURIComponent(convId) + '/messages?limit=100');
          state.messagesCache[convId] = Array.isArray(r.messages) ? r.messages : [];
        } catch (e) {
          state.messagesCache[convId] = [];
        }
        state.messagesLoading = false;
        mount();
      }

      function buildMessageTimeline(convId) {
        if (state.messagesLoading && !state.messagesCache[convId]) {
          return '<div class="wb-loading" style="padding:1rem"><div class="wb-skeleton"></div><div class="wb-skeleton"></div><div class="wb-skeleton"></div></div>';
        }
        const msgs = state.messagesCache[convId];
        if (!msgs) return '<div class="wb-empty" style="padding:1rem;color:var(--muted)">正在加载消息…</div>';
        if (msgs.length === 0) return '<div class="wb-empty" style="padding:1rem;color:var(--muted)">暂无消息记录。</div>';

        // Messages come newest-first from API, reverse to show oldest-first
        return msgs.slice().reverse().map(function(m) {
          var isOutbound = m.direction === 'outbound';
          var isSystem = m.direction === 'system' || m.sender_type === 'system';
          var time = m.created_at ? new Date(m.created_at).toLocaleString('zh-CN', { timeZone: 'Asia/Kuala_Lumpur', hour: '2-digit', minute: '2-digit', month: 'numeric', day: 'numeric' }) : '';
          if (isSystem) {
            return '<div class="msg-sys" style="text-align:center;color:var(--muted);font-size:0.78rem;margin:0.5rem 0">' + esc(m.body || '') + '</div>';
          }
          var label = isOutbound
            ? (m.sender_type === 'agent' ? '客服' : 'AI')
            : '访客';
          var bubbleStyle = isOutbound
            ? 'background:var(--primary);color:#fff;margin-left:auto'
            : 'background:var(--surface);border:1px solid var(--border)';
          return '<div style="display:flex;flex-direction:column;align-items:' + (isOutbound ? 'flex-end' : 'flex-start') + ';margin-bottom:0.75rem">' +
            '<div style="font-size:0.72rem;color:var(--muted);margin-bottom:0.2rem">' + esc(label) + ' · ' + esc(time) + '</div>' +
            '<div style="max-width:75%;padding:0.55rem 0.8rem;border-radius:0.75rem;font-size:0.875rem;white-space:pre-wrap;word-break:break-word;' + bubbleStyle + '">' + esc(m.body || '') + '</div>' +
            '</div>';
        }).join('');
      }

      function mount() {
        const f = state.filters;
        const filtered = inboxFiltered(state.list, f);
        let selId = state.selectedId;
        if (selId && !filtered.some((x) => x.id === selId)) selId = filtered[0] ? filtered[0].id : null;
        if (!selId && filtered.length) selId = filtered[0].id;
        state.selectedId = selId;
        const selected = filtered.find((x) => x.id === selId) || null;

        let listCountLabel = filtered.length + ' 条';
        if (state.apiError && !state.useMockPreview) listCountLabel = '加载失败';
        else if (!state.list.length) listCountLabel = '无会话';

        let rowsHtml = '';
        if (state.apiError && !state.useMockPreview) {

              // Preview: prefer API field, fallback to message cache (last inbound), then last any
              let previewText = '';

        let midHtml = '';

            '<button type="button" class="inbox-compose-tab">Internal Note</button>' +
            '</div>' +
            '<div class="inbox-compose-body">' +
            '<textarea disabled placeholder="Coming soon — reply and internal note will be enabled in the next release."></textarea>' +
            '<div class="inbox-compose-footer">' +
            '<span style="font-size:0.72rem;color:var(--muted);align-self:center;flex:1">Human reply coming soon</span>' +
            '<button type="button" class="btn" disabled style="color:var(--muted);cursor:not-allowed">Send</button>' +
            '</div>' +
            '</div>' +
            '</div>';
        }

        let sideHtml = '<div class="inbox-side-head">会话详情</div><div class="inbox-side-body">';
        if (state.apiError && !state.useMockPreview) {
          sideHtml += '<p class="muted" style="margin:0">API error: <code>' + esc(state.apiError) + '</code></p>';
        } else if (!selected) {
          sideHtml += '<p class="muted" style="margin:0;padding-top:0.5rem">选择一条会话后显示详情。</p>';
        } else {
          var sideName = inboxDisplayName(selected);
          var sideInitial = (sideName || '?').charAt(0).toUpperCase() || '?';
          var sideChannel = String(selected.channel || '').toLowerCase();
          var sideChannelLabel = { telegram: 'Telegram', whatsapp: 'WhatsApp', line: 'LINE', messenger: 'Messenger', website: 'Website', zalo: 'Zalo' }[sideChannel] || selected.channel;

          // ── Block 1: Contact ──────────────────────────────────
          sideHtml += '<div class="inbox-side-block">';
          sideHtml += '<h4>Contact</h4>';
          sideHtml += '<div style="display:flex;align-items:center;gap:0.55rem;margin-bottom:0.6rem">';
          sideHtml += '<div style="width:34px;height:34px;border-radius:999px;background:linear-gradient(135deg,#a5b4fc,var(--primary));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:0.9375rem;flex-shrink:0">' + esc(sideInitial) + '</div>';
          sideHtml += '<div style="min-width:0">';
          sideHtml += '<div style="font-weight:600;font-size:0.875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(sideName) + '</div>';
          sideHtml += '<div style="display:flex;align-items:center;gap:0.3rem;margin-top:0.15rem">' + channelIconPill(selected.channel) + '<span style="font-size:0.72rem;color:var(--muted)">' + esc(sideChannelLabel) + '</span></div>';
          sideHtml += '</div></div>';

            sideHtml += '<div class="inbox-side-row"><span class="inbox-side-row-label">External ID</span><span class="inbox-side-row-val" style="font-size:0.7rem;color:var(--muted)">' + esc(selected.external_contact_id) + '</span></div>';
          }
          sideHtml += '</div>';

          // ── Block 2: Conversation ─────────────────────────────
          sideHtml += '<div class="inbox-side-block">';
          sideHtml += '<h4>Conversation</h4>';
          sideHtml += '<div class="inbox-side-row"><span class="inbox-side-row-label">Status</span><span>' + inboxStatusTag(selected) + '</span></div>';
          sideHtml += '<div class="inbox-side-row"><span class="inbox-side-row-label">Owner</span><span class="inbox-side-row-val">' + esc(selected.current_owner_principal_id || 'Unassigned') + '</span></div>';
          sideHtml += '<div class="inbox-side-row"><span class="inbox-side-row-label">Last active</span><span class="inbox-side-row-val">' + esc(selected.last_message_at || '—') + '</span></div>';
          sideHtml += '<div class="inbox-side-row" style="margin-top:0.2rem"><span class="inbox-side-row-label">ID</span><span style="font-size:0.68rem;color:var(--muted);word-break:break-all;text-align:right">' + esc(selected.id.slice(0, 18)) + '…</span></div>';
          sideHtml += '</div>';

          // ── Block 3: Lead Snapshot ────────────────────────────
          var rawLead = selected._raw && selected._raw.lead ? selected._raw.lead : null;
          var hasLeadData = rawLead && (rawLead.name || rawLead.phone || rawLead.email);
          sideHtml += '<div class="inbox-side-block">';
          sideHtml += '<h4>Lead Snapshot</h4>';
          if (inboxBucket(selected) === 'pending_handoff') {
            sideHtml += '<div style="margin-bottom:0.55rem;padding:0.3rem 0.6rem;background:rgba(202,138,4,0.08);border:1px solid rgba(202,138,4,0.18);border-radius:6px;font-size:0.78rem;color:#92400e">⏳ Waiting for human agent</div>';
          }
          if (hasLeadData) {
            if (rawLead.name)  sideHtml += '<div class="inbox-side-row"><span class="inbox-side-row-label">Name</span><span class="inbox-side-row-val">' + esc(rawLead.name) + '</span></div>';
            if (rawLead.phone) sideHtml += '<div class="inbox-side-row"><span class="inbox-side-row-label">Phone</span><span class="inbox-side-row-val">' + esc(rawLead.phone) + '</span></div>';
            if (rawLead.email) sideHtml += '<div class="inbox-side-row"><span class="inbox-side-row-label">Email</span><span class="inbox-side-row-val">' + esc(rawLead.email) + '</span></div>';
            if (rawLead.need)  sideHtml += '<div class="inbox-side-row"><span class="inbox-side-row-label">Need</span><span class="inbox-side-row-val">' + esc(rawLead.need) + '</span></div>';
          } else {
            sideHtml += '<p style="font-size:0.8rem;color:var(--muted);font-style:italic;margin:0">No lead data yet</p>';
          }
          sideHtml += '</div>';

          } else {
            sideHtml += '<button type="button" class="btn btn-primary" data-inbox-act="assign" style="justify-content:center;width:100%;font-weight:600">Assign to me</button>';

          sideHtml += '<div class="btn-row" style="display:flex;gap:0.4rem;margin-top:0.35rem">';
          sideHtml += '<a style="flex:1;text-align:center;font-size:0.78rem;padding:0.3rem 0.5rem;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted);background:transparent;cursor:pointer;text-decoration:none;display:block" href="/app/leads" data-spa="/app/leads">Open Lead</a>';
          sideHtml += '<a style="flex:1;text-align:center;font-size:0.78rem;padding:0.3rem 0.5rem;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted);background:transparent;cursor:pointer;text-decoration:none;display:block" href="/app/knowledge" data-spa="/app/knowledge">Knowledge</a>';
          sideHtml += '</div>';
          sideHtml += '</div></div>';

        sideHtml += '</div>';

        const noteBar = state.apiNote

          '" /></div>' +

    function reportsSectionFromPath(p) {
      const path = p.length > 1 && p.endsWith('/') ? p.slice(0, -1) : p;
      if (path === '/app/reports') return 'overview';
      if (!path.startsWith('/app/reports/')) return null;
      const rest = path.slice('/app/reports/'.length).split('/')[0];
      if (!rest) return 'overview';
      const allowed = ['conversations', 'leads', 'handoff', 'channels', 'governance'];
      return allowed.includes(rest) ? rest : null;
    }

      return REPORT_TABS.map((t) => {

      }).join('');
    }

          '<option value="90d"' + (state.rangeKey === '90d' ? ' selected' : '') + '>近 90 天（占位）</option>' +
          '<option value="custom"' + (state.rangeKey === 'custom' ? ' selected' : '') + '>自定义（占位）</option>' +
          '<option value="today"' + (state.rangeKey === 'today' ? ' selected' : '') + '>今天</option>' +
          '<option value="all"' + (state.rangeKey === 'all' ? ' selected' : '') + '>全部时间</option>' +
          '</select></div>' +
          '<div class="fld"><label>渠道</label><select class="rep-select" id="repChannel">' +
          '<option value="all"' + (state.channel === 'all' ? ' selected' : '') + '>全部渠道</option>' +
          '<option value="website">Website</option><option value="line">LINE</option><option value="messenger">Messenger</option>' +
          '</select></div>' +
          '<div class="fld"><label>Owner（占位）</label><select class="rep-select" disabled><option>全部成员</option></select></div>' +
          '<div class="fld"><label>Tenant 维度（占位）</label><select class="rep-select" disabled><option>当前工作区</option></select></div>' +
          '<div class="fld" style="margin-left:auto;flex-direction:row;align-items:flex-end;gap:0.35rem">' +
          '<button type="button" class="btn btn-secondary btn-sm" id="repExport">导出</button>' +
          '<button type="button" class="btn btn-secondary btn-sm" id="repSaveView">保存视图</button>' +
          '</div></div>' +
          '<nav class="rep-tabs" aria-label="Reports sections">' + repNavHtml(section) + '</nav>' +
          '<div class="rep-kpi-grid">' +
          '<a href="/app/inbox?status=open&src=reports_conversations" data-spa="/app/inbox?status=open&src=reports_conversations" class="rep-kpi-card" style="text-decoration:none;color:inherit">' +
          '<div class="v">' + esc(String(totalConv)) + '</div><div class="k">Conversations</div><div class="sub">总会话（周期内）</div></a>' +
          '<a href="/app/leads?status=new&src=reports_new_leads" data-spa="/app/leads?status=new&src=reports_new_leads" class="rep-kpi-card" style="text-decoration:none;color:inherit">' +
          '<div class="v">' + esc(String(newLeads)) + '</div><div class="k">New leads</div><div class="sub">新增线索</div></a>' +
          '<a href="/app/inbox?status=pending_handoff&src=reports_handoff_backlog" data-spa="/app/inbox?status=pending_handoff&src=reports_handoff_backlog" class="rep-kpi-card" style="text-decoration:none;color:inherit">' +
          '<div class="v">' + esc(String(handoff)) + '</div><div class="k">Handoff backlog</div><div class="sub">待人工 / 交接计数</div></a>' +
          '<a href="/app/leads" data-spa="/app/leads" class="rep-kpi-card" style="text-decoration:none;color:inherit">' +
          '<div class="v">' + esc(String(qual)) + '</div><div class="k">Qualified</div><div class="sub">合格线索（示意）</div></a>' +
          '<a href="/app/channels" data-spa="/app/channels" class="rep-kpi-card" style="text-decoration:none;color:inherit">' +
          '<div class="v">' + esc(chHealth) + '</div><div class="k">Channel health</div><div class="sub">结合 handoff 与开放会话</div></a>' +
          '<div class="rep-kpi-card">' +
          '<div class="v">' + esc(String(actMock)) + '</div><div class="k">Activity</div><div class="sub">消息/活动量（mock）</div></div>' +
          '</div>' +
          (section !== 'overview' ? repSectionPanel(section) : '') +
          '<div class="rep-block"><h3>Trend</h3><div class="rep-trend">' +
          '<p class="rep-trend-note">会话与线索趋势（静态占位，非实时绘图）</p>' +
          '<div class="rep-trend-chart">' + trendBars + '</div></div></div>' +
          '<div class="rep-block"><h3>Breakdown · 渠道分布（示意）</h3><div class="rep-break-grid">' + breakHtml + '</div>' +
          '<p class="muted" style="font-size:0.75rem;margin:0.5rem 0 0">与工具条「渠道」筛选联动为后续迭代；当前为展示占位。</p></div>' +
          '<div class="rep-block"><h3>需关注 · Exceptions</h3><ul class="rep-exc">' + excHtml + '</ul></div>' +
          '<div class="rep-links">' +
          '<a class="btn btn-secondary btn-sm" href="/app/overview" data-spa="/app/overview">Overview</a>' +
          '<a class="btn btn-secondary btn-sm" href="/app/inbox" data-spa="/app/inbox">Inbox</a>' +
          '<a class="btn btn-secondary btn-sm" href="/app/leads" data-spa="/app/leads">Leads</a>' +
          '<a class="btn btn-secondary btn-sm" href="/app/channels" data-spa="/app/channels">Channels</a>' +
          '</div></div>';

        document.getElementById('view').innerHTML = wrapPage('Reports', subtitle, body);
        bindSpaLinks(document.getElementById('view'));

        document.getElementById('repRange').onchange = (ev) => {
          state.rangeKey = ev.target.value;
          mount();
        };
        document.getElementById('repChannel').onchange = (ev) => {
          state.channel = ev.target.value;
          mount();
        };
        document.getElementById('repExport').onclick = () => alert('Placeholder: Export action is not wired in this round.');
        document.getElementById('repSaveView').onclick = () => alert('Placeholder: Save view preset is not wired in this round.');
      }

      await mount();
    }

    function setNav() {
      const p = location.pathname;
      document.querySelectorAll('aside a[data-nav]').forEach((a) => {
        const h = a.getAttribute('href');
        let active = h === p;
        if (h === '/app/settings') active = p === '/app/settings' || p.startsWith('/app/settings/');
        if (h === '/app/channels') active = p === '/app/channels' || p.startsWith('/app/settings/channels');
        if (h === '/app/reports') active = p === '/app/reports' || p.startsWith('/app/reports/');
        a.classList.toggle('active', active);
      });
    }

    async function route() {
      setNav();
      updateWorkspaceLabel();
      const connPanel = document.getElementById('connectionPanel');
      if (connPanel) connPanel.open = false;
      let p = location.pathname;
      if (p === '/app' || p === '/app/') {
        history.replaceState(null, '', '/app/overview');
        p = '/app/overview';
      }
      if (p === '/app/dashboard') {
        history.replaceState(null, '', '/app/overview');
        p = '/app/overview';
      }
      if (p === '/app/settings/setup/channels') {
        history.replaceState(null, '', '/app/settings/channels');
        p = '/app/settings/channels';
      }
      if (p === '/app/reports/') {
        history.replaceState(null, '', '/app/reports');
        p = '/app/reports';
      }
      document.getElementById('view').innerHTML = '';
      try {
        if (p === '/app/overview') await viewOverview();
        else if (p === '/app/settings') await viewSettingsHome();
        else if (p === '/app/settings/setup') await viewSettingsSetupHub();
        else if (p.startsWith('/app/settings/setup/')) await viewSetupStepDetail(p.slice('/app/settings/setup/'.length));
        else if (p === '/app/settings/workspace') viewAdvWorkspace();
        else if (p === '/app/settings/ai') await viewAi();
        else if (p.startsWith('/app/settings/channels/')) {
          const seg = p.slice('/app/settings/channels/'.length).split('/')[0];
          if (INTEGRATION_CHANNELS.some((c) => c.id === seg)) viewChannelWizard(seg);
          else {
            document.getElementById('view').innerHTML = wrapPage('Not found', '', '<p class="muted"><a href="/app/settings/channels" data-spa="/app/settings/channels">返回 Channels 总览</a></p>');
            bindSpaLinks(document.getElementById('view'));
          }
        } else if (p === '/app/settings/channels') await viewSettingsChannelsOverview();
        else if (p === '/app/settings/access') viewAdvAccess();
        else if (p === '/app/settings/golive') viewAdvGolive();
        else if (p === '/app/settings/recovery') viewAdvRecovery();
        else if (p === '/app/settings/products') await viewSettingsProducts();
        else if (p === '/app/settings/bot') await viewBotSettings();
        else if (p === '/app/channels') await viewChannels();
        else if (p === '/app/ai') await viewAi();
        else if (p === '/app/knowledge') await viewKnowledge();
        else if (p === '/app/team') await viewTeam();
        else if (p === '/app/inbox') await viewInbox();
        else if (p === '/app/leads') await viewLeads();
        else if (p === '/app/reports' || p.startsWith('/app/reports/')) await viewReports();
        else document.getElementById('view').innerHTML = wrapPage('Not found', '', '<p class="muted">Unknown route</p>');
      } catch (e) {
        document.getElementById('view').innerHTML = wrapPage('Error', '', '<p style="color:var(--danger);">' + esc(e.message) + '</p>');
      }
    }

    document.getElementById('tenantId').value = localStorage.getItem(TID_KEY) || '';
    document.getElementById('token').value = localStorage.getItem(TOK_KEY) || '';
    function persistConnectionFields() {
      localStorage.setItem(TID_KEY, document.getElementById('tenantId').value.trim());
      localStorage.setItem(TOK_KEY, document.getElementById('token').value.trim());
      updateWorkspaceLabel();
    }
    function setConnStatus(msg, ok) {
      const el = document.getElementById('connStatus');
      if (!el) return;
      el.textContent = msg;
      el.style.color = ok ? 'var(--success)' : 'var(--danger)';
    }
    document.getElementById('tenantId').onchange = persistConnectionFields;
    document.getElementById('token').onchange = persistConnectionFields;
    document.getElementById('tenantId').oninput = () => {
      persistConnectionFields();
      setConnStatus('连接参数已更新（自动生效）', true);
    };
    document.getElementById('token').oninput = () => {
      persistConnectionFields();
      setConnStatus('连接参数已更新（自动生效）', true);
    };
    document.getElementById('applyConn').onclick = async () => {
      persistConnectionFields();
      const rawId = document.getElementById('tenantId').value.trim().toLowerCase();
      const rawToken = document.getElementById('token').value.trim();
      const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(rawId);
      if (!isUuid) {
        setConnStatus('Tenant ID 格式错误（需 UUID）', false);
        return;
      }
      if (!rawToken) {
        setConnStatus('Bearer token 不能为空', false);
        return;
      }
      setConnStatus('连接已应用，正在刷新...', true);
      await route();
      setConnStatus('连接已应用', true);
      const connPanel = document.getElementById('connectionPanel');
      if (connPanel) connPanel.open = false;
    };

    // ── Avatar dropdown menu ─────────────────────────────────────────────────
    (function() {
      var btn = document.getElementById('avatarBtn');
      var dropdown = document.getElementById('avatarDropdown');
      if (!btn || !dropdown) return;
      function avdRefreshState() {
        var tId = document.getElementById('tenantId');
        var connected = tId && /^[0-9a-f-]{36}$/i.test(tId.value.trim());
        document.getElementById('avdName').textContent = connected ? ('Tenant: ' + tId.value.trim().slice(0, 8) + '…') : 'Tenant';
        document.getElementById('avdEmail').textContent = connected ? 'Connected' : 'Not connected';
      }
      btn.onclick = function(e) {
        e.stopPropagation();
        var hidden = dropdown.hasAttribute('hidden');
        avdRefreshState();
        if (hidden) dropdown.removeAttribute('hidden');
        else dropdown.setAttribute('hidden', '');
      };
      document.addEventListener('click', function() { dropdown.setAttribute('hidden', ''); });
      dropdown.addEventListener('click', function(e) { e.stopPropagation(); });
      // Disconnect → clear stored credentials
      var avdLogout = document.getElementById('avdLogout');
      if (avdLogout) avdLogout.onclick = function(e) {
        e.preventDefault();
        if (!confirm('Disconnect? This clears your stored Tenant ID and Token.')) return;
        localStorage.removeItem(TID_KEY);
        localStorage.removeItem(TOK_KEY);
        document.getElementById('tenantId').value = '';
        document.getElementById('token').value = '';
        dropdown.setAttribute('hidden', '');
        avdRefreshState();
        updateWorkspaceLabel();
        route();
      };
    })();
    // ────────────────────────────────────────────────────────────────────────

    window.addEventListener('popstate', route);
    document.querySelectorAll('aside a[data-nav]').forEach((a) => {
      a.addEventListener('click', (ev) => { ev.preventDefault(); history.pushState(null, '', a.getAttribute('href')); route(); });
    });
    updateWorkspaceLabel();
    route();
  </script>
</body>
</html>
