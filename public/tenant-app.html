<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatFlow Pro</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --surface: #ffffff;
      --border: #e4e4e7;
      --text: #18181b;
      --muted: #71717a;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #16a34a;
      --warning: #ca8a04;
      --danger: #dc2626;
      --radius: 12px;
      --radius-sm: 8px;
      --sidebar-w: 240px;
      --content-max: 1280px;
      --shadow: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .app { display: flex; min-height: 100vh; }
    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.25rem 0.75rem;
      display: flex;
      flex-direction: column;
    }
    .brand { font-size: 0.9375rem; font-weight: 600; padding: 0 0.75rem 1.25rem; letter-spacing: -0.02em; }
    .nav-label { font-size: 0.65rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 0.5rem 0.75rem 0.35rem; }
    .sidebar nav a {
      display: block;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
      margin-bottom: 2px;
    }
    .sidebar nav a:hover { color: var(--text); background: #f4f4f5; }
    .sidebar nav a.active { color: var(--primary); background: rgba(79, 70, 229, 0.08); font-weight: 500; }
    .main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    /* Top bar */
    .topbar {
      height: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 1rem;
    }
    .workspace-pill {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .search-placeholder {
      flex: 1;
      max-width: 400px;
      margin: 0 auto;
      padding: 0.45rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      color: var(--muted);
      background: #fafafa;
    }
    .topbar-right { display: flex; align-items: center; gap: 0.75rem; }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: linear-gradient(135deg, #a5b4fc, var(--primary));
      cursor: default;
    }
    /* Connection (collapsible) */
    details.connection {
      border-bottom: 1px solid var(--border);
      background: #fafafa;
      font-size: 0.75rem;
    }
    details.connection summary {
      padding: 0.5rem 1.5rem;
      cursor: pointer;
      color: var(--muted);
      list-style: none;
    }
    details.connection summary::-webkit-details-marker { display: none; }
    .connection-body { padding: 0 1.5rem 0.75rem; display: grid; gap: 0.5rem; max-width: var(--content-max); }
    .connection-body label { font-size: 0.6875rem; color: var(--muted); font-weight: 500; }
    .connection-body input {
      width: 100%;
      max-width: 480px;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
    }
    /* Main content */
    .content {
      flex: 1;
      padding: 1.5rem;
      overflow: auto;
    }
    .content-inner { max-width: var(--content-max); margin: 0 auto; }
    .page-header { margin-bottom: 1.5rem; }
    .page-title { font-size: 1.125rem; font-weight: 600; margin: 0 0 0.35rem; letter-spacing: -0.02em; }
    .page-desc { font-size: 0.875rem; color: var(--muted); margin: 0; }
    /* Overview */
    .status-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 900px) { .status-bar { grid-template-columns: 1fr; } }
    .status-cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      box-shadow: var(--shadow);
    }
    .status-cell h3 { margin: 0 0 0.35rem; font-size: 0.6875rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .status-cell .stat-main { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
    .status-cell .stat-sub { font-size: 0.8125rem; color: var(--muted); margin-bottom: 0.75rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.4rem 0.75rem;
      font-size: 0.8125rem;
      font-weight: 500;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: #f4f4f5; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .tag { display: inline-block; font-size: 0.6875rem; font-weight: 600; padding: 0.15rem 0.45rem; border-radius: 999px; }
    .tag-warn { background: rgba(202, 138, 4, 0.12); color: #a16207; }
    .tag-ok { background: rgba(22, 163, 74, 0.12); color: var(--success); }
    .tag-info { background: rgba(79, 70, 229, 0.1); color: var(--primary); }
    .tag-muted { background: #f4f4f5; color: var(--muted); }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 1000px) { .metric-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px) { .metric-grid { grid-template-columns: 1fr; } }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
    }
    .metric-card .val { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 0.25rem; }
    .metric-card .lbl { font-size: 0.8125rem; color: var(--muted); margin-bottom: 1rem; }
    .split {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
    }
    .panel h2 { margin: 0 0 1rem; font-size: 0.875rem; font-weight: 600; }
    .todo-list { list-style: none; margin: 0; padding: 0; }
    .todo-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }
    .todo-list li:last-child { border-bottom: none; }
    .feed-list { list-style: none; margin: 0; padding: 0; }
    .feed-list li { padding: 0.6rem 0; border-bottom: 1px solid var(--border); font-size: 0.8125rem; color: var(--muted); }
    .feed-list li:last-child { border-bottom: none; }
    .feed-list .t { color: var(--text); font-weight: 500; }
    .quick-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    /* Legacy views (inbox, etc.) */
    .muted { color: var(--muted); font-size: 0.875rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; margin: 1rem 0; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.85rem; }
    .card .v { font-size: 1.2rem; font-weight: 700; }
    .card .k { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
    .mod { border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; background: var(--surface); }
    .mod h3 { margin: 0 0 0.5rem; font-size: 0.875rem; }
    label.legacy { font-size: 0.75rem; color: var(--muted); display: block; margin: 0.35rem 0 0.2rem; }
    input.legacy, select.legacy { width: 100%; max-width: 400px; padding: 0.45rem 0.5rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); font-size: 0.875rem; }
    button.btn-legacy { margin-top: 0.5rem; padding: 0.45rem 0.85rem; border-radius: var(--radius-sm); border: 1px solid var(--primary); background: var(--primary); color: #fff; cursor: pointer; font-size: 0.8125rem; }
    .ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.75rem; }
    .ch-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem; background: var(--surface); }
    .row { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.45rem; }
    button.sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
    button.sm.p { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.sm.d { border-color: var(--danger); color: var(--danger); }
    .pill { font-size: 0.65rem; padding: 0.12rem 0.4rem; border-radius: 999px; background: rgba(22, 163, 74, 0.12); color: var(--success); font-weight: 600; }
    ul.check { margin: 0.5rem 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.875rem; }
    ul.check li.done { color: var(--success); }
    table.data { width: 100%; border-collapse: collapse; font-size: 0.8125rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    table.data th, table.data td { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); }
    table.data th { color: var(--muted); font-weight: 500; background: #fafafa; }
    table.data tr:last-child td { border-bottom: none; }
    pre.raw { background: #fafafa; padding: 0.75rem; border-radius: var(--radius-sm); overflow: auto; font-size: 11px; border: 1px solid var(--border); }
    /* Settings IA */
    .settings-breadcrumb { font-size: 0.8125rem; color: var(--muted); margin: 0 0 1rem; }
    .settings-breadcrumb a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .settings-breadcrumb a:hover { text-decoration: underline; }
    .bc-sep { margin: 0 0.35rem; color: var(--border); }
    .setup-progress-label { display: flex; justify-content: space-between; font-size: 0.8125rem; margin-bottom: 0.35rem; }
    .setup-progress-track { height: 6px; background: #e4e4e7; border-radius: 3px; overflow: hidden; margin-bottom: 1rem; }
    .setup-progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.2s; }
    .stepper { display: flex; flex-direction: column; gap: 0.5rem; }
    .step-row {
      display: grid; grid-template-columns: 2rem 1fr auto; gap: 1rem; align-items: center;
      padding: 1rem 1.1rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
    }
    .step-num { font-size: 0.75rem; font-weight: 700; color: var(--muted); width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #f4f4f5; }
    .step-row.done .step-num { background: rgba(22, 163, 74, 0.15); color: var(--success); }
    .step-row.doing .step-num { background: rgba(79, 70, 229, 0.12); color: var(--primary); }
    .step-body h3 { margin: 0 0 0.25rem; font-size: 0.9375rem; font-weight: 600; }
    .step-body p { margin: 0; font-size: 0.8125rem; color: var(--muted); }
    .adv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    .adv-card {
      display: block; text-align: left; padding: 1.15rem; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); cursor: pointer; text-decoration: none; color: inherit;
    }
    .adv-card:hover { border-color: #c4b5fd; background: #fafaff; }
    .adv-card h3 { margin: 0 0 0.35rem; font-size: 0.9375rem; font-weight: 600; }
    .adv-card p { margin: 0; font-size: 0.8125rem; color: var(--muted); line-height: 1.45; }
    .section-label { font-size: 0.6875rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.75rem; }
    .two-col-settings { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    @media (max-width: 900px) { .two-col-settings { grid-template-columns: 1fr; } }
    .placeholder-notice {
      padding: 1rem 1.1rem; border: 1px dashed var(--border); border-radius: var(--radius); background: #fafafa;
      font-size: 0.8125rem; color: var(--muted); margin-top: 1rem;
    }
    .wiz-pre {
      margin: 0;
      padding: 0.65rem 0.75rem;
      background: #f4f4f5;
      border-radius: 8px;
      font-size: 0.75rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    textarea.wiz-pre {
      display: block;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border);
      resize: vertical;
      min-height: 4.5rem;
      color: inherit;
    }
    textarea.wiz-pre:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
    }
    .tag-err { background: rgba(220, 38, 38, 0.1); color: var(--danger); }
    .int-hub-banner {
      padding: 0.85rem 1rem; border-radius: var(--radius); border: 1px solid var(--border); background: #fafafa;
      font-size: 0.8125rem; color: var(--muted); margin-bottom: 1.25rem;
    }
    .int-hub-banner.warn { border-color: rgba(202, 138, 4, 0.45); background: rgba(202, 138, 4, 0.06); color: #854d0e; }
    .int-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .int-card {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 1.15rem; background: var(--surface);
      display: flex; flex-direction: column; gap: 0.65rem; min-height: 11rem;
    }
    .int-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
    .int-card h3 { margin: 0; font-size: 0.9375rem; font-weight: 600; }
    .int-card p { margin: 0; font-size: 0.8125rem; color: var(--muted); line-height: 1.45; flex: 1; }
    .int-card-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .wiz-steps { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .wiz-step-pill {
      font-size: 0.6875rem; font-weight: 600; padding: 0.35rem 0.65rem; border-radius: 999px; border: 1px solid var(--border); color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .wiz-step-pill.active { border-color: var(--primary); color: var(--primary); background: rgba(79, 70, 229, 0.06); }
    .wiz-step-pill.done { border-color: rgba(22, 163, 74, 0.5); color: var(--success); background: rgba(22, 163, 74, 0.06); }
    .legacy-ch-details { margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem; }
    .legacy-ch-details summary { cursor: pointer; color: var(--muted); font-size: 0.8125rem; font-weight: 500; }
    /* Inbox workspace */
    .inbox-page { display: flex; flex-direction: column; gap: 0; margin: -0.25rem 0 0; }
    .inbox-page > .page-header { margin-bottom: 1rem; }
    .inbox-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.65rem;
      padding: 0.65rem 0.85rem; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0; border-bottom: none;
    }
    .inbox-toolbar label { font-size: 0.65rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 0.2rem; }
    .inbox-toolbar .fld { display: flex; flex-direction: column; min-width: 0; }
    .inbox-toolbar input.inbox-input, .inbox-toolbar select.inbox-select {
      font-size: 0.8125rem; padding: 0.35rem 0.5rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fafafa; min-width: 0;
    }
    .inbox-toolbar .fld-grow { flex: 1; min-width: 140px; max-width: 240px; }
    .inbox-board {
      display: grid; grid-template-columns: minmax(260px, 28%) 1fr minmax(220px, 22%);
      border: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius); overflow: hidden;
      background: var(--surface); min-height: 480px; max-height: min(72vh, 720px);
    }
    @media (max-width: 1100px) {
      .inbox-board { grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; max-height: none; }
      .inbox-col-side { grid-column: 1 / -1; border-top: 1px solid var(--border); max-height: 280px; overflow-y: auto; }
    }
    @media (max-width: 720px) {
      .inbox-board { grid-template-columns: 1fr; }
      .inbox-col-list { max-height: 220px; border-right: none !important; border-bottom: 1px solid var(--border); }
    }
    .inbox-col-list { border-right: 1px solid var(--border); background: #fafafa; display: flex; flex-direction: column; min-height: 0; }
    .inbox-col-mid { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
    .inbox-col-side { display: flex; flex-direction: column; min-height: 0; background: #fafafa; overflow: hidden; }
    .inbox-list-head { padding: 0.5rem 0.85rem; font-size: 0.6875rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
    .inbox-list-scroll { flex: 1; overflow-y: auto; min-height: 0; }
    .inbox-row {
      padding: 0.75rem 0.85rem; border-bottom: 1px solid var(--border); cursor: pointer; text-align: left;
      width: 100%; border-left: 3px solid transparent; background: transparent; font: inherit; color: inherit;
    }
    .inbox-row:hover { background: #f4f4f5; }
    .inbox-row.active { background: rgba(79, 70, 229, 0.06); border-left-color: var(--primary); }
    .inbox-row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.25rem; }
    .inbox-row-title { font-size: 0.875rem; font-weight: 600; margin: 0; line-height: 1.25; }
    .inbox-row-meta { font-size: 0.6875rem; color: var(--muted); white-space: nowrap; }
    .inbox-row-preview { font-size: 0.8125rem; color: var(--muted); margin: 0; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .inbox-row-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; margin-top: 0.45rem; }
    .inbox-ch-pill { font-size: 0.625rem; font-weight: 600; padding: 0.12rem 0.4rem; border-radius: 999px; background: #e4e4e7; color: #3f3f46; text-transform: capitalize; }
    .inbox-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--primary); flex-shrink: 0; }
    .inbox-st-new { background: rgba(79, 70, 229, 0.12); color: #4338ca; }
    .inbox-st-open { background: #e4e4e7; color: #52525b; }
    .inbox-st-handoff { background: rgba(202, 138, 4, 0.15); color: #a16207; }
    .inbox-st-human { background: rgba(59, 130, 246, 0.12); color: #1d4ed8; }
    .inbox-st-closed { background: rgba(22, 163, 74, 0.12); color: var(--success); }
    .inbox-empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.25rem; text-align: center; color: var(--muted); font-size: 0.875rem;
    }
    .inbox-empty strong { color: var(--text); font-size: 0.9375rem; display: block; margin-bottom: 0.35rem; }
    .inbox-detail-head { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .inbox-detail-head h2 { margin: 0 0 0.35rem; font-size: 1rem; font-weight: 600; }
    .inbox-detail-banner {
      margin: 0 1rem; padding: 0.5rem 0.75rem; border-radius: var(--radius-sm); font-size: 0.8125rem;
      background: rgba(202, 138, 4, 0.1); color: #854d0e; border: 1px solid rgba(202, 138, 4, 0.25);
    }
    .inbox-thread { flex: 1; overflow-y: auto; padding: 1rem; min-height: 0; }
    .msg-line { max-width: 85%; margin: 0.65rem 0; padding: 0.55rem 0.75rem; border-radius: var(--radius-sm); font-size: 0.8125rem; line-height: 1.45; }
    .msg-meta { display: block; font-size: 0.65rem; font-weight: 600; color: var(--muted); margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.03em; }
    .msg-user { align-self: flex-start; background: #f4f4f5; border: 1px solid var(--border); margin-right: auto; }
    .msg-ai { align-self: flex-end; background: rgba(79, 70, 229, 0.08); border: 1px solid rgba(79, 70, 229, 0.2); margin-left: auto; }
    .msg-sys { text-align: center; font-size: 0.75rem; color: var(--muted); padding: 0.35rem 0.5rem; margin: 0.5rem 0; }

    .stg-adv-title { margin: 0; font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
    .stg-step-actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; }
    .stg-step-status { min-width: 76px; text-align: center; }
    /* Reports management shell */
    .rep-page { margin: -0.25rem 0 0; }
    .rep-page > .page-header { margin-bottom: 1rem; }
    .rep-api-note { font-size: 0.75rem; color: var(--warning); margin: 0 0 0.75rem; padding: 0.5rem 0.75rem; background: rgba(202, 138, 4, 0.08); border-radius: var(--radius-sm); border: 1px solid rgba(202, 138, 4, 0.2); }
    .rep-toolbar {
      display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.5rem 0.75rem;
      padding: 0.65rem 0.85rem; margin-bottom: 0.75rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    }
    .rep-toolbar label { font-size: 0.65rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 0.2rem; }
    .rep-toolbar .fld { display: flex; flex-direction: column; min-width: 0; }
    .rep-toolbar select.rep-select, .rep-toolbar button.btn { font-size: 0.8125rem; }
    .rep-toolbar select.rep-select { padding: 0.35rem 0.5rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fafafa; }
    .rep-tabs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
    .rep-tab {
      font-size: 0.8125rem; font-weight: 500; padding: 0.4rem 0.75rem; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); text-decoration: none;
    }
    .rep-tab:hover { color: var(--text); background: #f4f4f5; }
    .rep-tab.active { border-color: var(--primary); color: var(--primary); background: rgba(79, 70, 229, 0.06); }
    .rep-kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.75rem; margin-bottom: 1.25rem; }
    .rep-kpi-card {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; background: var(--surface);
      box-shadow: var(--shadow);
    }
    .rep-kpi-card .v { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
    .rep-kpi-card .k { font-size: 0.6875rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.35rem; }
    .rep-kpi-card .sub { font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; }
    .rep-block { margin-bottom: 1.25rem; }
    .rep-block h3 { margin: 0 0 0.65rem; font-size: 0.8125rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .rep-trend {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; background: var(--surface); min-height: 140px;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .rep-trend-chart { display: flex; align-items: flex-end; gap: 4px; height: 72px; margin-top: 0.5rem; }
    .rep-trend-bar { flex: 1; background: linear-gradient(180deg, rgba(79, 70, 229, 0.35), rgba(79, 70, 229, 0.08)); border-radius: 3px 3px 0 0; min-height: 12px; }
    .rep-trend-note { font-size: 0.75rem; color: var(--muted); margin: 0; }
    .rep-break-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.75rem; }
    .rep-break-item { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.65rem 0.75rem; background: #fafafa; font-size: 0.8125rem; }
    .rep-break-item .row { display: flex; justify-content: space-between; margin-bottom: 0.25rem; }
    .rep-break-track { height: 6px; background: #e4e4e7; border-radius: 3px; overflow: hidden; margin-top: 0.35rem; }
    .rep-break-fill { height: 100%; background: var(--primary); border-radius: 3px; opacity: 0.75; }
    ul.rep-exc { list-style: none; margin: 0; padding: 0; }
    .rep-exc { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
    .rep-exc li { padding: 0.65rem 0.85rem; border-bottom: 1px solid var(--border); font-size: 0.8125rem; display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .rep-exc li:last-child { border-bottom: none; }
    .rep-exc .tag { flex-shrink: 0; }
    .rep-links { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .rep-section-panel { border: 1px dashed var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; background: #fafafa; margin-top: 1rem; }
    .rep-section-panel h4 { margin: 0 0 0.35rem; font-size: 0.9375rem; font-weight: 600; }
    .rep-section-panel p { margin: 0; font-size: 0.8125rem; color: var(--muted); line-height: 1.45; }
    /* Products settings page */
    .prod-page { max-width: 700px; }
    .prod-list { list-style: none; padding: 0; margin: 0 0 1.25rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .prod-item { display: flex; align-items: center; justify-content: space-between; padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); gap: 0.75rem; }
    .prod-item-name { font-size: 0.875rem; font-weight: 500; color: var(--text); flex: 1; }
    .prod-add-row { display: flex; gap: 0.5rem; align-items: flex-end; }
    .prod-add-row input { flex: 1; }
    /* Knowledge panel (slide-in form) */
    .kn-panel-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.18); display: flex; align-items: stretch; justify-content: flex-end; }
    .kn-panel { width: 420px; max-width: 100vw; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: -4px 0 24px rgba(0,0,0,0.1); }
    .kn-panel-head { padding: 1rem 1.1rem 0.75rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .kn-panel-head h3 { margin: 0; font-size: 1rem; font-weight: 600; }
    .kn-panel-body { flex: 1; overflow-y: auto; padding: 1.1rem; display: flex; flex-direction: column; gap: 0.85rem; }
    .kn-panel-actions { padding: 0.85rem 1.1rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; flex-shrink: 0; }
    .kn-faq-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.65rem 0.85rem; border: none; border-bottom: 1px solid var(--border); background: transparent; width: 100%; text-align: left; cursor: default; }
    .kn-faq-row-info { flex: 1; min-width: 0; }
    .kn-faq-row-q { font-size: 0.875rem; font-weight: 500; color: var(--text); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kn-faq-row-tags { display: flex; gap: 0.3rem; margin-top: 0.25rem; flex-wrap: wrap; }
    .kn-faq-row-actions { display: flex; gap: 0.35rem; align-items: center; flex-shrink: 0; }
    .kn-toggle { cursor: pointer; width: 36px; height: 20px; border-radius: 999px; border: none; background: #d4d4d8; position: relative; flex-shrink: 0; transition: background 0.15s; }
    .kn-toggle.on { background: var(--primary, #6366f1); }
    .kn-toggle::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 999px; background: #fff; transition: transform 0.15s; }
    .kn-toggle.on::after { transform: translateX(16px); }
    .icon-btn { background: transparent; border: none; cursor: pointer; padding: 0.2rem 0.3rem; border-radius: var(--radius-sm, 4px); color: var(--muted); font-size: 0.875rem; }
    .icon-btn:hover { background: #f4f4f5; color: var(--text); }
    /* Avatar dropdown menu */
    .avatar-menu { position: relative; }
    .avatar-btn { width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, #a5b4fc, var(--primary)); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.75rem; font-weight: 700; }
    .avatar-dropdown { position: absolute; right: 0; top: calc(100% + 8px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,0.12); min-width: 200px; z-index: 200; }
    .avatar-dropdown-header { padding: 0.85rem 1rem 0.65rem; }
    .avatar-dropdown-header strong { display: block; font-size: 0.875rem; color: var(--text); }
    .avatar-dropdown-header .avd-email { font-size: 0.75rem; color: var(--muted); }
    .avatar-dropdown hr { margin: 0; border: none; border-top: 1px solid var(--border); }
    .avatar-dropdown a { display: block; padding: 0.6rem 1rem; font-size: 0.8125rem; color: var(--text); text-decoration: none; cursor: pointer; }
    .avatar-dropdown a:hover { background: #f4f4f5; }
    .avatar-dropdown a.avd-danger { color: #dc2626; }
    /* Lang tabs for Bot Experience */
    .lang-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 1rem; }
    .lang-tab { padding: 0.45rem 1rem; font-size: 0.8125rem; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; background: none; border-top: none; border-left: none; border-right: none; }
    .lang-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    /* Translate button in FAQ row */
    .kn-tr-btn { font-size: 0.75rem; padding: 0.2rem 0.6rem; background: #ede9fe; color: #6d28d9; border: 1px solid #c4b5fd; border-radius: var(--radius-sm, 4px); white-space: nowrap; }
    .kn-tr-btn:hover { background: #ddd6fe; }
    /* Import success CTA banner */
    .kn-import-cta { background: #f0fdf4; border: 1px solid #86efac; border-radius: var(--radius); padding: 0.85rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .kn-import-cta-msg { font-size: 0.875rem; color: #166534; font-weight: 500; }
    .kn-import-cta-hint { font-size: 0.8rem; color: #166534; margin-top: 0.2rem; }
    /* Translation status pills in knowledge list */
    .tr-pill { display: inline-block; font-size: 0.65rem; font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 999px; background: #f4f4f5; color: var(--muted); }
    .tr-pill.pub { background: #dcfce7; color: #16a34a; }
    .tr-pill.draft { background: #fef9c3; color: #a16207; }
    /* FAQ translation panel (wider) */
    .kn-panel-wide { width: 720px; }
    .kn-tr-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 800px) { .kn-tr-cols { grid-template-columns: 1fr; } .kn-panel-wide { width: 100vw; } }
    .kn-section-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 0.75rem; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">ChatFlow</div>
      <div class="nav-label">Menu</div>
      <nav>
        <a href="/app/overview" data-nav>Overview</a>
        <a href="/app/inbox" data-nav>Inbox</a>
        <a href="/app/leads" data-nav>Leads</a>
        <a href="/app/knowledge" data-nav>Knowledge</a>
        <a href="/app/channels" data-nav>Channels</a>
        <a href="/app/reports" data-nav>Reports</a>
        <a href="/app/settings" data-nav>Settings</a>
      </nav>
    </aside>
    <div class="main-col">
      <header class="topbar">
        <span class="workspace-pill" id="workspaceLabel">Workspace · 未连接</span>
        <div class="search-placeholder" aria-hidden="true">搜索会话、联系人…（即将推出）</div>
        <div class="topbar-right">
          <div class="avatar-menu" id="avatarMenu">
            <button class="avatar-btn" id="avatarBtn" title="Account menu">B</button>
            <div class="avatar-dropdown" id="avatarDropdown" hidden>
              <div class="avatar-dropdown-header">
                <strong id="avdName">Workspace</strong>
                <span class="avd-email" id="avdEmail">API Connection required</span>
              </div>
              <hr>
              <a href="#" data-spa="/app/settings/workspace">Workspace</a>
              <a href="#" id="avdApiConn">API Connection</a>
              <hr>
              <a href="#" id="avdLogout" class="avd-danger">Disconnect</a>
            </div>
          </div>
        </div>
      </header>
      <details class="connection" id="connectionPanel">
        <summary>API 连接 · Tenant ID 与 Token</summary>
        <div class="connection-body">
          <div>
            <label class="legacy" for="tenantId">Tenant ID (UUID)</label>
            <input class="legacy" type="text" id="tenantId" placeholder="00000000-0000-4000-8000-000000000000" />
          </div>
          <div>
            <label class="legacy" for="token">Bearer token</label>
            <input class="legacy" type="password" id="token" autocomplete="off" />
          </div>
          <div>
            <label class="legacy">Connection</label>
            <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
              <button type="button" class="btn" id="applyConn">Apply connection</button>
              <span id="connStatus" class="muted">未应用</span>
            </div>
          </div>
        </div>
      </details>
      <main class="content">
        <div class="content-inner" id="view"></div>
      </main>
    </div>
  </div>
  <script>
    const TID_KEY = 'chatflow_tenant_app_id';
    const TOK_KEY = 'chatflow_tenant_app_token';
    /** Public origin for webhook URL preview only (browser localStorage). */
    const LS_PUBLIC_WEBHOOK_BASE = 'chatflow_tenant_public_webhook_base';

    /** Static mock for Overview (round 1 — no API). */
    const MOCK_OVERVIEW = {
      setupPct: 60,
      setupLabel: '进行中',
      channelsConnected: 5,
      channelsTotal: 7,
      channelAlerts: 2,
      goLive: 'pending',
      goLiveLabel: '尚未完成签核',
      metrics: { conv: 12, leads: 3, handoff: 5, health: '2 项需关注' },
      todos: [
        { t: '连接 LINE 渠道', done: false },
        { t: '至少录入 3 条 FAQ', done: false },
        { t: '邀请一名团队成员', done: true },
      ],
      feed: [
        { time: '10:02', text: '新线索 · Website' },
        { time: '09:41', text: '会话转交 Handoff · WhatsApp' },
        { time: '昨天', text: '渠道健康检查 · Telegram 异常已恢复' },
      ],
    };

    function api(path, opts) {
      const t = document.getElementById('token').value.trim();
      const headers = { 'content-type': 'application/json', ...(opts && opts.headers), authorization: 'Bearer ' + t };
      return fetch(path, { ...opts, headers }).then(async (r) => {
        const text = await r.text();
        let j = null;
        try { j = JSON.parse(text); } catch (_) {}
        if (!r.ok) throw new Error((j && (j.message || j.error)) || text || r.status);
        return j;
      });
    }

    function tid() {
      const x = document.getElementById('tenantId').value.trim().toLowerCase();
      if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(x)) throw new Error('invalid_tenant_id');
      return x;
    }

    function base() {
      return '/saas/v1/admin/platform/tenants/' + tid();
    }

    let AUTH_SUMMARY_CACHE = null;
    async function authSummary() {
      if (AUTH_SUMMARY_CACHE) return AUTH_SUMMARY_CACHE;
      try {
        AUTH_SUMMARY_CACHE = await api('/saas/v1/admin/auth/summary');
      } catch (_) {
        AUTH_SUMMARY_CACHE = { role: 'unknown' };
      }
      return AUTH_SUMMARY_CACHE;
    }

    function queryParam(name, fallback) {
      const v = new URLSearchParams(location.search).get(name);
      return v == null || v === '' ? fallback : v;
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function fmtTime(ts) {
      if (!ts) return '--';
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return String(ts);
      return d.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (_) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (_) {
          return false;
        }
      }
    }

    /** Telegram wizard step 3 (index 2): show tenant webhook URL + setWebhook curl. */
    function wireTelegramWebhookStep() {
      const baseInput = document.getElementById('wizPublicWebhookBase');
      const slugEl = document.getElementById('wizTenantSlug');
      const fullInput = document.getElementById('wizWebhookFullUrl');
      const curlPre = document.getElementById('wizCurlSetWebhook');
      const statusEl = document.getElementById('wizWebhookStepStatus');
      if (!baseInput || !slugEl || !fullInput || !curlPre) return;

      baseInput.value = localStorage.getItem(LS_PUBLIC_WEBHOOK_BASE) || '';

      const recompute = () => {
        let b = baseInput.value.trim().replace(/\/+$/, '');
        if (b) localStorage.setItem(LS_PUBLIC_WEBHOOK_BASE, b);
        else localStorage.removeItem(LS_PUBLIC_WEBHOOK_BASE);
        const slug = (slugEl.dataset.slug || '').trim().toLowerCase();
        const full = b && slug ? b + '/webhooks/t/' + slug + '/telegram' : '';
        fullInput.value = full;
        let curlLine = '';
        if (full) {
          const bodyJson = JSON.stringify({ url: full });
          curlLine =
            'curl -sS -X POST "https://api.telegram.org/botYOUR_BOT_TOKEN_HERE/setWebhook" -H "Content-Type: application/json" -d ' +
            JSON.stringify(bodyJson);
        }
        curlPre.value = curlLine || '（填写公网 Base URL 并成功加载 slug 后，将自动生成命令；也可在记事本改好再粘贴进来）';
        if (statusEl) {
          const loading = slugEl.textContent === '加载中…';
          if (loading) statusEl.textContent = '正在解析租户 slug…';
          else if (!slug) statusEl.textContent = '无法显示 URL：未加载到 slug（请检查 Tenant ID / Token）';
          else if (!b) statusEl.textContent = '请填写公网 Base URL（HTTPS）';
          else if (full) statusEl.textContent = '可复制 Webhook URL 或 curl；将 YOUR_BOT_TOKEN_HERE 整段换成真实 Token（不要加尖括号）';
        }
      };

      baseInput.addEventListener('input', recompute);
      baseInput.addEventListener('blur', recompute);

      document.getElementById('wizCopyWebhookUrl')?.addEventListener('click', async () => {
        const v = fullInput.value.trim();
        if (!v) {
          if (statusEl) statusEl.textContent = '没有可复制的完整 URL';
          return;
        }
        const ok = await copyToClipboard(v);
        if (statusEl) statusEl.textContent = ok ? '已复制 Webhook URL' : '复制失败，请手动选择文本复制';
      });
      document.getElementById('wizCopyCurl')?.addEventListener('click', async () => {
        const v = curlPre.value.trim();
        if (!v || v.startsWith('（')) {
          if (statusEl) statusEl.textContent = '没有可复制的 curl';
          return;
        }
        const ok = await copyToClipboard(v);
        if (statusEl) statusEl.textContent = ok ? '已复制 curl（记得把 YOUR_BOT_TOKEN_HERE 换成真实 Token）' : '复制失败，请手动选择文本复制';
      });

      recompute();
      void (async () => {
        try {
          const ov = await api(base() + '/overview');
          const tenant = ov.overview && ov.overview.tenant;
          const slug = tenant && tenant.slug ? String(tenant.slug).trim().toLowerCase() : '';
          if (slug) {
            slugEl.textContent = slug;
            slugEl.dataset.slug = slug;
          } else {
            slugEl.textContent = '（接口未返回 slug）';
            delete slugEl.dataset.slug;
          }
        } catch (e) {
          slugEl.textContent = '加载失败';
          delete slugEl.dataset.slug;
          if (statusEl) statusEl.textContent = '无法加载 slug：' + (e && e.message ? e.message : String(e));
        }
        recompute();
      })();
    }

    function updateWorkspaceLabel() {
      const id = document.getElementById('tenantId').value.trim();
      const el = document.getElementById('workspaceLabel');
      if (/^[0-9a-f-]{36}$/i.test(id)) {
        el.textContent = 'Workspace · ' + id.slice(0, 8) + '…';
      } else {
        el.textContent = 'Workspace · 未连接';
      }
    }

    function setupStepState(status, blocked) {
      if (blocked) return 'blocked';
      return status ? 'done' : 'pending';
    }

    function setupTagFromState(st) {
      if (st === 'done') return '<span class="tag st-success">Closed</span>';
      if (st === 'blocked') return '<span class="tag st-danger">Blocked</span>';
      return '<span class="tag st-warn">Pending</span>';
    }

    async function fetchSetupSnapshot() {
      const ov = await api(base() + '/overview');
      const overview = ov.overview || {};
      let settings = {};
      let goLiveLatest = null;
      let channelsBundle = null;
      try {
        const s = await api(base() + '/settings');
        settings = s.settings || {};
      } catch (_) {}
      try {
        const g = await api(base() + '/go-live-check/latest');
        goLiveLatest = g.latest || null;
      } catch (_) {}
      try {
        channelsBundle = await api(base() + '/channels');
      } catch (_) {}
      const c = overview.setup_checks || {};
      const checks = {
        workspace: Boolean(c.company_info_complete),
        ai: Boolean(c.openai_key_saved && c.ai_enabled),
        channels: Boolean(c.first_channel_connected),
        knowledge: Boolean(c.faq_added),
        test: Boolean(c.test_passed),
        golive: Boolean(

            window.alert('尚未连接该渠道：请先在向导中完成配置（占位提示）。');

    async function fetchChannelsBundle() {
      try {
        const b = base();
        const o = await api(b + '/channels');
        const ov = await api(b + '/overview');
        const suspended = ov && ov.overview && ov.overview.tenant && ov.overview.tenant.status === 'suspended';

        let b = null;
        try {
          b = base();

        return { ok: false, err: e.message, o: { channels: [], validations: [] }, b, suspended: false };

          statusTg.textContent = msg;
          statusTg.style.color = ok ? 'var(--success)' : 'var(--danger)';
        };
        saveTg.onclick = async () => {
          try {
            const token = String(document.getElementById('wizTelegramToken')?.value || '').trim();
            if (!token) {
              setWizStatus('Telegram Bot Token 不能为空', false);
              return;
            }
            await api(base() + '/credentials', {
              method: 'PUT',
              body: JSON.stringify({ credentials: { TELEGRAM_BOT_TOKEN: token } }),

            setWizStatus('已保存 Telegram token', true);

          }

      if (testTg && statusTg) {

              : '测试失败';

          } catch (e) {
            statusTg.textContent = '测试失败：' + e.message;

        wireTelegramWebhookStep();

      // LINE Step 1 — save credentials
      const saveLineBtn = document.getElementById('wizSaveLineToken');
      const lineStatus = document.getElementById('wizLineCredentialStatus');
      if (saveLineBtn && lineStatus) {
        const setLineStatus = (msg, ok) => {
          lineStatus.textContent = msg;
          lineStatus.style.color = ok ? 'var(--success)' : 'var(--danger)';
        };
        saveLineBtn.onclick = async () => {
          try {
            const token = String(document.getElementById('wizLineToken')?.value || '').trim();
            const secret = String(document.getElementById('wizLineSecret')?.value || '').trim();
            if (!token) { setLineStatus('Channel Access Token 不能为空', false); return; }
            if (!secret) { setLineStatus('Channel Secret 不能为空', false); return; }
            await api(base() + '/credentials', {
              method: 'PUT',
              body: JSON.stringify({ credentials: { LINE_CHANNEL_ACCESS_TOKEN: token, LINE_CHANNEL_SECRET: secret } }),
            });
            setLineStatus('已保存 LINE 凭证', true);
          } catch (e) {
            setLineStatus('保存失败：' + e.message, false);
          }
        };
      }
      // LINE Step 2 — webhook URL
      const lineWh = document.getElementById('wizLineWebhookUrl');
      const copyLineWh = document.getElementById('wizCopyLineWebhookUrl');
      if (lineWh) {
        const origin = window.location.origin;
        lineWh.value = origin + '/webhooks/t/loading.../line';
        void (async () => {
          try {
            const ov = await api(base() + '/overview');
            const slug = ov.overview?.tenant?.slug ? String(ov.overview.tenant.slug).trim().toLowerCase() : '';
            lineWh.value = origin + '/webhooks/t/' + (slug || tenantId || 'YOUR_SLUG') + '/line';
          } catch (_) { /* keep placeholder */ }
        })();
      }
      if (copyLineWh && lineWh) {
        copyLineWh.onclick = () => {
          navigator.clipboard?.writeText(lineWh.value).then(() => {
            copyLineWh.textContent = '已复制';
            setTimeout(() => { copyLineWh.textContent = '复制 URL'; }, 2000);
          }).catch(() => window.alert(lineWh.value));
        };
      }
    }

    async function viewSetupStepDetail(stepId) {
      const idx = MOCK_SETUP_STEPS.findIndex((s) => s.id === stepId);
      const s = idx >= 0 ? MOCK_SETUP_STEPS[idx] : null;
      if (!s) {
        document.getElementById('view').innerHTML = wrapPage('未知步骤', '', '<p class="muted">返回 <a href="/app/settings/setup" data-spa="/app/settings/setup">Setup</a></p>');
        bindSpaLinks(document.getElementById('view'));
        return;
      }
      const next = MOCK_SETUP_STEPS[idx + 1];
      const prev = MOCK_SETUP_STEPS[idx - 1];
      let body = '<p class="muted" style="margin:0;">Placeholder step content.</p>';
      let stateTag = '<span class="tag st-warn">Pending</span>';
      let note = '';
      try {
        const snap = await fetchSetupSnapshot();
        const stMap = {
          workspace: setupStepState(snap.checks.workspace, false),
          ai: setupStepState(snap.checks.ai, !snap.checks.workspace),
          channels: setupStepState(snap.checks.channels, !snap.checks.ai),
          knowledge: setupStepState(snap.checks.knowledge, !snap.checks.channels),
          test: setupStepState(snap.checks.test, !snap.checks.knowledge),
          golive: setupStepState(snap.checks.golive, !snap.checks.test),
        };
        const st = stMap[s.id] || 'pending';
        stateTag = setupTagFromState(st);
        if (s.id === 'workspace') {
          body =
            '<p class="muted">Save workspace profile to mark tenant setup intent.</p>' +
            '<label class="legacy">Display name</label><input class="legacy" id="stWorkspaceName" type="text" placeholder="Workspace name" />' +
            '<label class="legacy">Timezone</label><input class="legacy" id="stWorkspaceTz" type="text" value="Asia/Bangkok" />' +
            '<button type="button" class="btn" id="stWorkspaceSave">Save workspace</button>';
        } else if (s.id === 'ai') {
          body =
            '<p class="muted">Save AI key and run connectivity test.</p>' +
            '<label class="legacy">OpenAI key</label><input class="legacy" id="stAiKey" type="password" placeholder="sk-..." />' +

        } else if (s.id === 'channels') {

          body =
            '<p class="muted">Connect at least one channel, then run test.</p>' +
            '<div class="quick-row"><a class="btn" href="/app/settings/channels" data-spa="/app/settings/channels">Configure Channels</a><a class="btn" href="/app/channels" data-spa="/app/channels">Open Channel Hub</a></div>' +
            '<label class="legacy">Connected channel for test</label><select class="legacy" id="stChannelId">' + options + '</select>' +
            '<button type="button" class="btn btn-primary" id="stChannelTest"' + (connected.length ? '' : ' disabled') + '>Test channel</button>';
        } else if (s.id === 'knowledge') {
          body =
            '<p class="muted">Publish at least one knowledge entry.</p>' +
            '<label class="legacy">Question</label><input class="legacy" id="stKQ" type="text" placeholder="FAQ question" />' +
            '<label class="legacy">Answer</label><input class="legacy" id="stKA" type="text" placeholder="FAQ answer" />' +
            '<button type="button" class="btn btn-primary" id="stKPublish">Publish entry</button>';
        } else if (s.id === 'test') {
          body =
            '<p class="muted">Record at least one successful test result.</p>' +
            '<div class="row"><button type="button" class="btn btn-primary" id="stTestAi">Run AI test</button><button type="button" class="btn" id="stTestWebsite">Run Website test</button></div>';

            '<p class="muted" style="margin-top:0.5rem">signoff_ack: ' + (signed ? 'true' : 'false') + '</p>';
        }
      } catch (e) {
        note = 'Data unavailable. Showing fallback step shell.';
      }
      document.getElementById('view').innerHTML =
        settingsBreadcrumb([{ href: '/app/settings', label: 'Settings' }, { href: '/app/settings/setup', label: 'Setup' }, { label: s.label }]) +

        (prev ? '<a class="btn" href="/app/settings/setup/' + esc(prev.id) + '" data-spa="/app/settings/setup/' + esc(prev.id) + '">上一步</a>' : '') +
        (next ? '<a class="btn btn-primary" href="/app/settings/setup/' + esc(next.id) + '" data-spa="/app/settings/setup/' + esc(next.id) + '">下一步</a>' : '<a class="btn btn-primary" href="/app/settings" data-spa="/app/settings">完成并回 Settings</a>') +

        } catch (e) { alert(e.message); }
      };
      const aiTest = document.getElementById('stAiTest');
      if (aiTest) aiTest.onclick = async () => {
        try {
          const r = await api(base() + '/ai/test-connection', { method: 'POST', body: '{}' });

        } catch (e) { alert(e.message); }
      };
      const kp = document.getElementById('stKPublish');

          await viewSetupStepDetail(stepId);
        } catch (e) { alert(e.message); }
      };
      const tAi = document.getElementById('stTestAi');
      if (tAi) tAi.onclick = async () => {
        try { const r = await api(base() + '/ai/test-connection', { method: 'POST', body: '{}' }); alert(r.ok ? 'Test passed.' : 'Test failed.'); await viewSetupStepDetail(stepId); } catch (e) { alert(e.message); }
      };
      const tW = document.getElementById('stTestWebsite');
      if (tW) tW.onclick = async () => {
        try { const r = await api(base() + '/channels/website/test-widget', { method: 'POST', body: '{}' }); alert(r.ok ? 'Website test passed.' : 'Website test failed.'); await viewSetupStepDetail(stepId); } catch (e) { alert(e.message); }
      };
      const gr = document.getElementById('stGoRun');
      if (gr) gr.onclick = async () => {
        try { const r = await api(base() + '/go-live-check/run', { method: 'POST', body: '{}' }); alert('Go-live check: ' + r.status); await viewSetupStepDetail(stepId); } catch (e) { alert(e.message); }
      };
      const gs = document.getElementById('stGoSignoff');
      if (gs) gs.onclick = async () => {
        try { await api(base() + '/settings', { method: 'PUT', body: JSON.stringify({ settings: { go_live: { signoff_ack: true, signoff_at: new Date().toISOString() } } }) }); alert('Signoff flag recorded.'); await viewSetupStepDetail(stepId); } catch (e) { alert(e.message); }
      };
    }

      } catch (e) {
        apiNote = 'Products API unavailable: ' + e.message;
      }

      function mount() {
        const listHtml = products.length
          ? '<ul class="prod-list">' + products.map(function(p) {
              return '<li class="prod-item"><span class="prod-item-name">' + esc(p.name) + '</span>' +
              '<button type="button" class="btn btn-sm" data-prod-del="' + esc(p.id) + '">Delete</button></li>';
            }).join('') + '</ul>'
          : '<p class="muted" style="margin:0 0 1rem">No products yet. Add one below.</p>';

        document.getElementById('view').innerHTML =
          settingsBreadcrumb([{ href: '/app/settings', label: 'Settings' }, { label: 'Products' }]) +
          '<div class="stg-page"><div class="page-header"><h1 class="page-title">Products</h1><p class="page-desc">产品分类：FAQ 知识条目的产品标签。</p></div>' +

          '<button type="button" class="btn btn-primary" id="prodAddBtn">Add product</button></div></div>' +
          '<div class="quick-row" style="margin-top:1rem"><a class="btn" href="/app/settings" data-spa="/app/settings">← Settings</a></div></div>';

        bindSpaLinks(document.getElementById('view'));

        document.querySelectorAll('[data-prod-del]').forEach(function(btn) {
          btn.onclick = async function() {
            var pid = btn.getAttribute('data-prod-del');
            var nameEl = btn.closest('li').querySelector('.prod-item-name');
            if (!confirm('Delete product "' + (nameEl ? nameEl.textContent : pid) + '"?')) return;
            try {
              await api(base() + '/products/' + encodeURIComponent(pid), { method: 'DELETE' });
              products = products.filter(function(p) { return p.id !== pid; });
              mount();
            } catch (e) {
              alert('Delete failed: ' + e.message);
            }
          };
        });

        var addBtn = document.getElementById('prodAddBtn');
        var nameInput = document.getElementById('prodNameInput');
        if (addBtn && nameInput) {
          addBtn.onclick = async function() {
            var name = nameInput.value.trim();
            if (!name) { alert('Product name is required.'); return; }
            try {
              var r = await api(base() + '/products', { method: 'POST', body: JSON.stringify({ name: name }) });
              products = [r.product].concat(products);
              nameInput.value = '';
              mount();
            } catch (e) {
              alert('Create failed: ' + e.message);
            }
          };
          nameInput.onkeydown = function(ev) { if (ev.key === 'Enter') addBtn.click(); };
        }
      }
      mount();
    }

          '<label class="legacy" style="font-size:0.82rem;font-weight:500">Leave-Message Prompt by Language</label>' +

          }).join('') +

          '<input class="legacy" type="number" id="bsLeadN" min="0" max="20" value="' + (bot.lead_trigger_after_n || 0) + '" style="width:100px" /></div>' +

          '<div class="fld-group" style="margin-bottom:1.5rem">' +
          '<label class="legacy" style="font-size:0.82rem;font-weight:500">Lead Nudge Text by Language</label>' +
          LANGS.map(function(l) {
            var val = (bot.lead_nudge_by_language && bot.lead_nudge_by_language[l.code]) || '';
            return '<div style="margin-top:0.4rem">' +
              '<label class="legacy" style="font-size:0.75rem;color:var(--muted)">' + l.label + '</label>' +
              '<input class="legacy" type="text" data-nudge-lang="' + l.code + '" value="' + esc(val) + '" style="width:100%" placeholder="' + (l.code === 'zh' ? '如果你愿意，也可以留下联系方式…' : 'Feel free to leave your contact…') + '" /></div>';
          }).join('') +
          '</div>' +

          '<div style="display:flex;gap:0.75rem;margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--border)">' +
          '<button type="button" class="btn btn-primary" id="bsSave">' + (saving ? 'Saving…' : 'Save Bot Experience') + '</button>' +
          '<a class="btn" href="/app/settings" data-spa="/app/settings">← Back</a></div>' +
          '</div></div>';

        document.getElementById('view').innerHTML = html;
        bindSpaLinks(document.getElementById('view'));

        // Language tab switching — Welcome
        document.querySelectorAll('[data-tab-group="wb"]').forEach(function(tab) {
          tab.onclick = function() {
            collectCurrentTabInputs();
            welcomeLangTab = tab.getAttribute('data-lang-tab');
            mount();
          };
        });
        // Language tab switching — Leave prompt
        document.querySelectorAll('[data-tab-group="lv"]').forEach(function(tab) {
          tab.onclick = function() {
            leaveLangTab = tab.getAttribute('data-lang-tab');
            mount();
          };
        });

        // Dynamic button add/del for welcome tabs
        document.querySelectorAll('[data-wbtn-del]').forEach(function(btn) {
          btn.onclick = function() {
            collectCurrentTabInputs();
            var lang = btn.getAttribute('data-wbtn-prefix');
            var idx = parseInt(btn.getAttribute('data-wbtn-del'));
            var wl = getLangWelcome(lang);
            wl.buttons = wl.buttons.filter(function(_, i) { return i !== idx; });
            setLangWelcome(lang, wl.message, wl.buttons);
            mount();
          };
        });
        document.querySelectorAll('[data-wbtn-add]').forEach(function(btn) {
          btn.onclick = function() {
            collectCurrentTabInputs();
            var lang = btn.getAttribute('data-wbtn-add');
            var wl = getLangWelcome(lang);
            wl.buttons = wl.buttons || [];
            if (wl.buttons.length < 5) { wl.buttons.push(''); setLangWelcome(lang, wl.message, wl.buttons); mount(); }
          };
        });

        // Save
        var saveBtn = document.getElementById('bsSave');
        if (saveBtn) {
          saveBtn.onclick = async function() {
            collectCurrentTabInputs();
            bot.persona = (document.getElementById('bsPersona').value || '').trim();
            bot.followup_prompt = (document.getElementById('bsFollowup').value || '').trim();
            bot.leave_message_mode = document.getElementById('bsLeaveMsg').checked;
            bot.lead_trigger_after_n = parseInt(document.getElementById('bsLeadN').value) || 0;

            // Collect leave prompts
            var promptMap = {}; var confirmMap = {};
            document.querySelectorAll('[data-lv-prompt]').forEach(function(x) { promptMap[x.getAttribute('data-lv-lang')] = x.value.trim(); });
            document.querySelectorAll('[data-lv-confirm]').forEach(function(x) { confirmMap[x.getAttribute('data-lv-lang')] = x.value.trim(); });
            bot.leave_message_prompt_by_language = promptMap;
            bot.leave_message_confirmation_by_language = confirmMap;
            // zh fallback
            bot.leave_message_prompt_text = promptMap['zh'] || bot.leave_message_prompt_text;
            bot.leave_message_confirmation_text = confirmMap['zh'] || bot.leave_message_confirmation_text;

            // Collect nudge
            var nudgeMap = {};
            document.querySelectorAll('[data-nudge-lang]').forEach(function(x) { nudgeMap[x.getAttribute('data-nudge-lang')] = x.value.trim(); });
            bot.lead_nudge_by_language = nudgeMap;
            bot.lead_nudge_text = nudgeMap['zh'] || bot.lead_nudge_text;

            // Chooser
            var supported = Array.from(document.querySelectorAll('.be-lang-sup:checked')).map(function(x) { return x.getAttribute('data-lang'); });
            chooser.enabled = document.getElementById('beChooserEnabled').checked;
            chooser.supported = supported.length > 0 ? supported : ['zh'];
            chooser.default_language = document.getElementById('beDefaultLang').value;
            chooser.auto_skip_if_platform_lang = document.getElementById('beAutoSkip').checked;

            // welcome_message / welcome_buttons: use zh tab as fallback
            var zhWl = getLangWelcome('zh');
            bot.welcome_message = zhWl.message || bot.welcome_message;
            bot.welcome_buttons = zhWl.buttons || bot.welcome_buttons;

            saving = true; mount();
            try {
              var res = await api(base() + '/bot-settings', {
                method: 'PUT',
                body: JSON.stringify({ bot: bot, language_chooser: chooser }),
              });
              if (res.ok) { apiNote = ''; alert('Bot Experience saved.'); }
              else { apiNote = 'Save failed: ' + (res.error || JSON.stringify(res)); }
            } catch (e) { apiNote = 'Save failed: ' + e.message; }
            saving = false; mount();
          };
        }
      }
      mount();
    }

    function wrapPage(title, desc, inner) {

        (desc ? '<p class="page-desc">' + esc(desc) + '</p>' : '') + '</div>' + inner;
    }

    async function mountLegacyChannelsEditor(mountEl, bundle) {
      const o = bundle.o;
      const b = bundle.b;
      const suspended = bundle.suspended;
      if (!b) {
        mountEl.innerHTML = '<p class="muted">填写 Tenant ID 与 Token 后可使用旧版技术配置面板。</p>';
        return;
      }
      mountEl.innerHTML =
        (suspended ? '<p class="muted" style="color:var(--warning);">租户已暂停：测试已禁用</p>' : '') +
        '<div class="ch-grid" id="cg"></div>' +
        '<div class="mod"><h3>Configuration panel（旧版）</h3>' +
        '<label class="legacy">Channel key</label><select class="legacy" id="cfgChannel"><option value="telegram">telegram</option><option value="whatsapp">whatsapp</option><option value="messenger">messenger</option><option value="line">line</option><option value="zalo">zalo</option><option value="website">website</option></select>' +
        '<div id="cfgBody" style="margin-top:0.5rem;"></div>' +
        '<p class="muted" id="cfgValidation">last tested: n/a</p></div>';
      const root = document.getElementById('cg');
      root.innerHTML = (o.channels || []).map((c) => {
        const v = (o.validations || []).find((x) => x.channel === c.id);
        return '<div class="ch-card"><strong>' + esc(c.label) + '</strong> ' +
          (c.connected ? '<span class="pill">on</span>' : '<span class="muted">off</span>') +
          '<div class="muted">last tested: ' + (v && v.last_test ? esc(v.last_test.tested_at) : 'n/a') + '</div>' +
          '<div class="row">' +
          '<button type="button" class="sm" data-edit="' + esc(c.id) + '">Edit</button>' +
          '<button type="button" class="sm p" data-t="' + esc(c.id) + '"' + (c.connected && !suspended ? '' : ' disabled') + '>Test</button>' +
          '<button type="button" class="sm d" data-d="' + esc(c.id) + '"' + (c.connected ? '' : ' disabled') + '>Disconnect</button>' +
          '</div></div>';
      }).join('');

      const keys = {
        telegram: 'TELEGRAM_BOT_TOKEN',
        whatsapp: 'WHATSAPP_ACCESS_TOKEN',
        messenger: 'MESSENGER_PAGE_ACCESS_TOKEN',
        line: 'LINE_CHANNEL_ACCESS_TOKEN',
        zalo: 'ZALO_ACCESS_TOKEN'
      };
      const cfgChannel = document.getElementById('cfgChannel');
      const cfgBody = document.getElementById('cfgBody');
      const cfgValidation = document.getElementById('cfgValidation');
      const renderCfg = async () => {
        const c = cfgChannel.value;
        if (c === 'website') {
          const wc = await api(b + '/channels/website/config');
          cfgBody.innerHTML =
            '<p class="muted">Current status: ' + (wc.current_status.widget_enable ? 'enabled' : 'disabled') + '</p>' +
            '<label class="legacy"><input type="checkbox" id="wEnable" ' + (wc.current_status.widget_enable ? 'checked' : '') + ' /> widget enable</label>' +
            '<label class="legacy">Welcome message</label><input class="legacy" type="text" id="wMsg" value="' + esc(wc.input.welcome_message || '') + '" />' +
            '<label class="legacy">Connected domain</label><input class="legacy" type="text" id="wDomain" placeholder="example.com" />' +
            '<label class="legacy">Install script</label><input class="legacy" type="text" readonly value="' + esc(wc.input.install_script || '') + '" />' +
            '<div class="row"><button type="button" class="sm p" id="wSave">Save</button><button type="button" class="sm p" id="wSaveTest"' + (suspended ? ' disabled' : '') + '>Save & Test</button></div>';
          cfgValidation.textContent = 'last tested: ' + (wc.validation_info.last_tested_at || 'n/a') + ' | last error: ' + (wc.validation_info.last_error || 'none');
          document.getElementById('wSave').onclick = async () => {
            try {
              await api(b + '/channels/website/config', { method: 'PUT', body: JSON.stringify({
                widget_enable: document.getElementById('wEnable').checked,
                welcome_message: document.getElementById('wMsg').value.trim(),
                domain: document.getElementById('wDomain').value.trim(),
                domain_verified: false
              })});
              alert('Saved');
              await renderCfg();
            } catch (e) { alert(e.message); }
          };
          document.getElementById('wSaveTest').onclick = async () => {
            try {
              await document.getElementById('wSave').onclick();
              const t = await api(b + '/channels/website/test-widget', { method: 'POST', body: '{}' });
              alert(t.ok ? 'Widget test passed' : 'Widget test failed');
              await viewChannels();
            } catch (e) { alert(e.message); }
          };
          return;
        }
        cfgBody.innerHTML =
          '<p class="muted">Current status: input token/access token and save.</p>' +
          '<label class="legacy">Token value</label><input class="legacy" type="text" id="cToken" placeholder="paste token" />' +
          '<div class="row"><button type="button" class="sm p" id="cSave">Save</button><button type="button" class="sm p" id="cSaveTest"' + (suspended ? ' disabled' : '') + '>Save & Test</button></div>';
        cfgValidation.textContent = 'last tested: n/a';
        document.getElementById('cSave').onclick = async () => {
          try {
            const k = keys[c];
            await api(b + '/credentials', { method: 'PUT', body: JSON.stringify({ credentials: { [k]: document.getElementById('cToken').value.trim() } }) });
            alert('Saved');
            await viewChannels();
          } catch (e) { alert(e.message); }
        };
        document.getElementById('cSaveTest').onclick = async () => {
          try {
            await document.getElementById('cSave').onclick();
            const r = await api(b + '/channels/' + c + '/test', { method: 'POST', body: '{}' });
            alert(r.ok ? 'OK' : 'FAIL');
            await viewChannels();
          } catch (e) { alert(e.message); }
        };
      };
      cfgChannel.onchange = renderCfg;
      await renderCfg();
      root.querySelectorAll('[data-t]').forEach((btn) => {
        btn.onclick = async () => {
          try {
            const r = await api(b + '/channels/' + btn.dataset.t + '/test', { method: 'POST', body: '{}' });
            alert(r.ok ? 'OK' : 'FAIL\n' + JSON.stringify(r.checks, null, 2));
          } catch (e) { alert(e.message); }
        };
      });
      root.querySelectorAll('[data-d]').forEach((btn) => {
        btn.onclick = async () => {
          if (!confirm('Disconnect?')) return;
          try {
            await api(b + '/channels/' + btn.dataset.d + '/disconnect', { method: 'POST', body: '{}' });
            viewChannels();
          } catch (e) { alert(e.message); }
        };
      });
      root.querySelectorAll('[data-edit]').forEach((btn) => {
        btn.onclick = async () => { cfgChannel.value = btn.dataset.edit; await renderCfg(); };
      });
    }

    async function viewAi() {
      document.getElementById('view').innerHTML = wrapPage('AI & Model', 'Loading...', '<div class="wb-banner">Loading...</div>');
      let a, ov;
      try {
        [a, ov] = await Promise.all([api(base() + '/ai'), api(base() + '/overview')]);
      } catch (e) {
        document.getElementById('view').innerHTML = wrapPage('AI & Model', '', '<div class="wb-banner">Failed to load: ' + esc(e.message) + '</div>');
        return;
      }
      const suspended = ov && ov.overview && ov.overview.tenant && ov.overview.tenant.status === 'suspended';
      const llm = a.input || {};
      const keySaved = !!(a.input && a.input.has_openai_key);
      const lastError = a.validation_info && a.validation_info.last_error;
      const lastTested = a.validation_info && a.validation_info.last_tested_at;

      // mutable state
      var st = {
        enabled: !!(a.current_status && a.current_status.ai_enabled),
        model: llm.model || 'gpt-4o-mini',
        showKeyInput: false,
        msg: '',
        msgOk: false,
        testing: false,
      };

      function render() {
        var statusDot = st.enabled
          ? '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--success,#22c55e);margin-right:6px"></span><strong style="color:var(--success,#22c55e)">Enabled</strong>'
          : '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#d4d4d8;margin-right:6px"></span><strong style="color:var(--muted)">Disabled</strong>';
        var keyStatus = keySaved
          ? '<span style="color:var(--success,#22c55e)">\u2713 API Key configured</span>'
          : '<span style="color:var(--danger,#ef4444)">\u2717 No API Key</span>';

        document.getElementById('view').innerHTML = wrapPage(
          'AI & Model',
          'Control AI reply behaviour for your workspace.',
          (suspended ? '<div class="wb-banner" style="color:var(--warning)">Tenant suspended \u2014 test disabled.</div>' : '') +

    function normalizeKnowledgeEntry(e, idx) {
      const statusMap = ['draft', 'published', 'needs_review', 'archived'];
      const source = String(e.source_type || '').toLowerCase();
      let status = e.is_active ? 'published' : 'draft';
      if (source === 'needs_review' || source === 'review_pending' || source === 'imported') status = 'needs_review';
      if (source === 'archived' || source === 'legacy') status = 'archived';
      if (source === 'published') status = 'published';
      if (source === 'draft') status = 'draft';
      const question = String(e.question || '').trim();
      const answer = String(e.answer || '').trim();
      return {
        id: e.id || ('k-api-' + idx),
        title: question || ('Untitled knowledge #' + (idx + 1)),
        type: source === 'faq' ? 'FAQ' : source === 'article' ? 'Article' : source === 'guide' ? 'Guide' : source === 'snippet' ? 'Snippet' : 'FAQ',
        status: statusMap.includes(status) ? status : 'draft',
        category: String(e.category || 'general'),
        language: String(e.language || 'en').toLowerCase(),
        updated_at: e.updated_at || null,
        preview: answer ? answer.slice(0, 108) : '暂无摘要（占位）。',
        content: answer || '暂无正文（占位）。',
        source_type: source || 'manual',
      };
    }

    function statusTagClass(st) {
      if (st === 'published') return 'st-success';
      if (st === 'needs_review') return 'st-warn';
      if (st === 'archived') return 'st-muted';
      return 'st-info';
    }

    function statusLabel(st) {
      if (st === 'published') return 'Published';
      if (st === 'needs_review') return 'Needs review';
      if (st === 'archived') return 'Archived';
      return 'Draft';
    }

    function knowledgeFiltered(list, f) {
      return list.filter((it) => {
        if (f.status !== 'all' && it.status !== f.status) return false;
        if (f.category !== 'all' && it.category !== f.category) return false;
        if (f.language !== 'all' && it.language !== f.language) return false;
        if (f.q) {
          const hay = (it.title + ' ' + it.preview + ' ' + it.content + ' ' + it.category).toLowerCase();
          if (!hay.includes(f.q.toLowerCase())) return false;
        }
        return true;
      });
    }

            state.trPanel.statusMsg = status === 'published' ? '✓ Published successfully' : '· Saved as draft';
