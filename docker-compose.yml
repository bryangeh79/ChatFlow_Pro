# Local / LAN staging: get SMOKE_BASE_URL without a cloud PaaS.
#   docker compose up --build
#   SMOKE_BASE_URL=http://127.0.0.1:3030 npm run smoke:webhooks
#
# Per-customer production: one deployment per customer — docs/169, ops docs/170, backup: npm run backup:data
# Optional secrets: `docker-compose.local-credentials.yml` or uncomment env_file below (never commit .env).

services:
  chatflow-pro:
    build: .
    ports:
      # Host port when 3030 is taken (e.g. local dev): STAGING_HOST_PORT=3031 docker compose up
      - "${STAGING_HOST_PORT:-3030}:3030"
    environment:
      PORT: "3030"
    # env_file:
    #   - .env
