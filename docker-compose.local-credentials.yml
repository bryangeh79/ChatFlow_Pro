# Optional overlay: inject project-root `.env` into the container for **real** outbound / webhook secrets.
# Base compose stays secret-free by default.
#
# Usage (repo root):
#   docker compose -f docker-compose.yml -f docker-compose.local-credentials.yml up --build
#
# PowerShell:
#   docker compose -f docker-compose.yml -f docker-compose.local-credentials.yml up --build
#
# Never commit `.env`. See docs/158.

services:
  chatflow-pro:
    env_file:
      - .env
